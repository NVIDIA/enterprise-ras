# ============================================================================
# Global Variables - 2-8-9-400 Deployment
# ============================================================================

# ============================================================================
# Authentication & Access
# ============================================================================
ldap:
  enabled: true
  domain: example.com
  organization: "Example Inc"
  admin_password: "{{ ldap_admin_password }}"  # Defined in secrets.yml
  base_dn: dc=example,dc=com
  root_dn: cn=admin,ou=Users,dc=example,dc=com
  servers:
    - ip: 192.168.200.252
      priority: 1
  users:
  - {firstname: "John", lastname: "Doe", username: "jdoe", password: "{{ ldap_user_default_password }}"}
  - {firstname: "Alice", lastname: "Smith", username: "asmith", password: "{{ ldap_user_default_password }}"}

switch_user: cumulus
# switch_password is defined in secrets.yml

# ============================================================================
# Cumulus Linux Version
# ============================================================================
target_cumulus_version: 5.13.0

nvue_syntax:
  '5.13':
    boolean_on: 'on'
    boolean_off: 'off'
    boolean_enabled: 'on'
    boolean_disabled: 'off'
    ip_address_key: ip
    state_format: nested

# ============================================================================
# Network Definitions
# ============================================================================
common:
  gpu_network: 192.168.110.0/24
  gpu_gateway: 192.168.110.1
  gpu_vlan: 900
  cpu_network: 172.16.178.0/24
  cpu_gateway: 172.16.178.1
  cpu_vlan: 300
  support_network: 172.16.179.0/24
  support_gateway: 172.16.179.1
  support_vlan: 400
  storage_network: 172.16.180.0/24
  storage_gateway: 172.16.180.1
  storage_vlan: 500

