# ============================================================================
# CORE-01 Host-Specific Variables - 2-4-3-200 Deployment
# ============================================================================
ansible_host: 192.168.200.201
mac_address: 48:b0:2d:5d:11:cd
ip_assignment_mode: dhcp

# Identity
hostname: core-01
router_id: 172.16.176.11
lo_ip: 172.16.176.11/32

# VLAN SVIs (host-specific IPs)
vlan_interfaces:
- id: vlan200
  ip: 172.16.177.2/24
  vrr: 172.16.177.1/24
  vlan: '200'
  vrf: OOB
- id: vlan300
  ip: 172.16.178.2/24
  vrr: 172.16.178.1/24
  vlan: '300'
  vrf: INBAND
- id: vlan400
  ip: 172.16.179.2/24
  vrr: 172.16.179.1/24
  vlan: '400'
  vrf: INBAND
- id: vlan500
  ip: 172.16.180.2/24
  vrr: 172.16.180.1/24
  vlan: '500'
  vrf: INBAND
- id: vlan900
  ip: 192.168.110.2/24
  vrr: 192.168.110.1/24
  vlan: '900'
  vrf: GPU

# Prefix Lists (host-specific IPs in rules)
prefix_list:
- id: ALL_PREFIXES
  rule:
  - id: '10'
    match: 0.0.0.0/0
    max_len: '32'
- id: EXIT_LOCAL_IF
  rule:
  - id: '10'
    match: 172.16.176.5/32
    max_len: '32'
- id: INBAND_LOCAL_IF
  rule:
  - id: '10'
    match: 172.16.176.3/32
    max_len: '32'
  - id: '20'
    match: 172.16.178.2/32
    max_len: '32'
  - id: '30'
    match: 172.16.179.2/32
    max_len: '32'
  - id: '40'
    match: 172.16.180.2/32
    max_len: '32'
- id: INBAND_PREFIXES
  rule:
  - id: '10'
    match: 172.16.178.0/24
    max_len: '32'
  - id: '20'
    match: 172.16.179.0/24
    max_len: '32'
  - id: '30'
    match: 172.16.180.0/24
    max_len: '32'
  - id: '40'
    match: 172.16.176.3/32
    max_len: '32'
- id: ERA_PREFIXES
  rule:
  - id: '10'
    match: 172.16.176.0/21
    max_len: '24'
  - id: '20'
    match: 172.16.176.0/24
    max_len: '32'
- id: LOCAL_OOB_LOOPBACK
  rule:
  - id: '10'
    match: 172.16.176.1/32
    max_len: '32'
- id: OOB_LOCAL_IF
  rule:
  - id: '10'
    match: 172.16.176.1/32
    max_len: '32'
  - id: '20'
    match: 172.16.177.2/32
    max_len: '32'
- id: OOB_PREFIXES
  rule:
  - id: '10'
    match: 172.16.177.0/24
    max_len: '32'
  - id: '20'
    match: 172.16.176.1/32
    max_len: '32'
- id: VTEP_PREFIXES
  rule:
  - id: '5'
    match: 172.16.176.8/29
    max_len: '32'

# VRF Loopback IPs (host-specific)
vrf_loopbacks:
  EXIT: 172.16.176.5/32
  INBAND: 172.16.176.3/32
  GPU: 192.168.110.5/32
  OOB: 172.16.176.1/32


