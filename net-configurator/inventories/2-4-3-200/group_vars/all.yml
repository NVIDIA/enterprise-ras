# ============================================================================
# Global Variables - 2-4-3-200 Deployment
# ============================================================================

# ============================================================================
# Authentication & Access
# ============================================================================
ldap:
  enabled: true
  domain: example.com
  organization: "Example Inc"
  admin_password: "{{ ldap_admin_password }}"
  base_dn: dc=example,dc=com
  root_dn: cn=admin,ou=Users,dc=example,dc=com
  servers:
    - ip: 192.168.200.252
      priority: 1
  users:
  - {firstname: "John", lastname: "Doe", username: "jdoe", password: "{{ ldap_user_default_password }}"}
  - {firstname: "Alice", lastname: "Smith", username: "asmith", password: "{{ ldap_user_default_password }}"}

switch_user: cumulus
# switch_password is defined in secrets.yml

# ============================================================================
# Cumulus Linux Version
# ============================================================================
target_cumulus_version: 5.13.0

nvue_syntax:
  '5.13':
    boolean_on: 'on'
    boolean_off: 'off'
    boolean_enabled: 'on'
    boolean_disabled: 'off'
    ip_address_key: ip
    state_format: nested

# ============================================================================
# Network Definitions
# ============================================================================
common:
  gpu_network: 192.168.110.0/24
  gpu_gateway: 192.168.110.1
  gpu_vlan: 900
  cpu_network: 172.16.178.0/24
  cpu_gateway: 172.16.178.1
  cpu_vlan: 300
  support_network: 172.16.179.0/24
  support_gateway: 172.16.179.1
  support_vlan: 400
  storage_network: 172.16.180.0/24
  storage_gateway: 172.16.180.1
  storage_vlan: 500

# ============================================================================
# Device Inventory
# ============================================================================
host_dhcp: true

devices:
  su-01-node-01:
    eth0_ip: 192.168.200.11
    mac: 44:38:39:22:aa:03
    gpu_ip1: 192.168.110.201/24
    gpu_ip2: 192.168.110.202/24
    bond_ip: 172.16.178.201/24
  su-01-node-02:
    eth0_ip: 192.168.210.12
    mac: 44:38:39:22:aa:04
    gpu_ip1: 192.168.110.203/24
    gpu_ip2: 192.168.110.204/24
    bond_ip: 172.16.178.203/24
  storage-01:
    eth0_ip: 192.168.200.31
    mac: 44:38:39:22:aa:07
    bond_ip1: 172.16.180.101/24
    bond_ip2: 172.16.180.102/24
  storage-02:
    eth0_ip: 192.168.210.32
    mac: 44:38:39:22:aa:08
    bond_ip1: 172.16.180.103/24
    bond_ip2: 172.16.180.104/24
  support-01:
    eth0_ip: 192.168.200.21
    mac: 44:38:39:22:aa:09
    bond_ip1: 172.16.179.101/24
    bond_ip2: 172.16.179.102/24
  support-02:
    eth0_ip: 192.168.210.22
    mac: 44:38:39:22:aa:0a
    bond_ip1: 172.16.179.103/24
    bond_ip2: 172.16.179.104/24

# ============================================================================
# ZTP Server Configuration (single OOB network)
# ============================================================================
ztp_server_ip: "169.254.0.2"
ztp_server_host: "dhcp-oob"

configure_ztp_ips: true
ztp_interfaces:
  - name: eth1
    ip: 192.168.200.252
    network: 192.168.200.0/24
    gateway: 192.168.200.1
    purpose: oob
    dnsmasq_listen: true

# DHCP Configuration
configure_dhcp: true
dhcp_domain_name: "era.local"
dhcp_range_start: "192.168.1.100"
dhcp_range_end: "192.168.1.200"
dhcp_lease_time: "12h"
dhcp_gateway: "192.168.1.1"
dnsmasq_interface: "ens3"

# Cumulus Linux OS Management
cumulus_target_release: ""
cumulus_image_url: ""

# ZTP Features
ztp_enable_topology: false
ztp_enable_monitoring: false
ztp_monitoring_config: |
  # Add your monitoring configuration here
ztp_final_reboot: true

# SSH Configuration
ssh_public_key_path: "~/.ssh/id_rsa.pub"

# Miscellaneous
# timezone is set per switch-group in group_vars/oob.yml and group_vars/core.yml
generate_configs: true
prompt_before_setup: false

