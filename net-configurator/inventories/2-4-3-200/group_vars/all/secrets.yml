# ============================================================================
# Secrets Configuration - 2-4-3-200 Deployment
# ============================================================================
# This file contains all sensitive credentials for this deployment.
#
# SECURITY OPTIONS:
#   1. Encrypt with Ansible Vault:
#      ansible-vault encrypt inventories/2-4-3-200/group_vars/all/secrets.yml
#
#   2. Use environment variables (set before running playbooks):
#      export ANSIBLE_VAULT_PASSWORD_FILE=~/.vault_pass
#
#   3. Prompt for vault password:
#      ansible-playbook ... --ask-vault-pass
#
# To edit encrypted file:
#   ansible-vault edit inventories/2-4-3-200/group_vars/all/secrets.yml
# ============================================================================

# -----------------------------------------------------------------------------
# Ansible Connection Passwords
# -----------------------------------------------------------------------------
# Used by Ansible to SSH into devices

# Password for switches (cumulus user)
switch_ansible_password: "Cumu1usLinux!"

# Password for servers (ubuntu user)
server_ansible_password: "nvidia"

# -----------------------------------------------------------------------------
# Ansible Become (sudo) Password
# -----------------------------------------------------------------------------
# Used for privilege escalation on remote hosts
# If set, you won't need --ask-become-pass

ansible_become_password: "nvidia"

# -----------------------------------------------------------------------------
# Switch Configuration Password
# -----------------------------------------------------------------------------
# Password set on switches during ZTP provisioning

switch_password: "Cumu1usLinux!"

# -----------------------------------------------------------------------------
# LDAP Passwords
# -----------------------------------------------------------------------------
# Used for LDAP server and switch authentication

# LDAP admin/bind password
ldap_admin_password: "Ldap@123"

# Default password for LDAP users
ldap_user_default_password: "Cumu1usLinux!"


# ZTP Status Page
# -----------------------------------------------------------------------------
# Only used when status_page_enabled=Yes in the Excel Settings tab. Do NOT reuse
# switch_password here — the status page is served over plain HTTP.
