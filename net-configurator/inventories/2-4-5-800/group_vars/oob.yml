# ============================================================================
# OOB (OOB SN2201) Group Variables - 2-4-5-800 Deployment
# ============================================================================
# SN2201: 48× 1G RJ45 + 4× 100G QSFP28
# Dual 100G uplinks to N/S spines (swp49, swp51)
# L2 access ports for server BMC (VLAN 200)

timezone: 'Etc/UTC'

# OOB VLAN
oob_vlan: 200
oob_vni: 245200
oob_vrf: OOB

# VRF OOB
vrf_oob_evpn_vlan: 3001
vrf_oob_vni: 245001

# Uplink ports to N/S spines
spine_uplink_ports:
  - swp49
  - swp51

# Access ports (1G BMC)
access_ports: "swp1-48"

# Overlay peers (N/S spines)
overlay_peers:
  - 172.16.1.2
  - 172.16.1.3
oob_uplink_mode: l3
