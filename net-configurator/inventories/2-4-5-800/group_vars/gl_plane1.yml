# ============================================================================
# GSL Plane 1 (E/W Plane 1 Leaf) Group Variables - 2-4-5-800 Deployment
# ============================================================================

plane: 1
asn: 4200101101  # overridden per-host for unique leaf ASNs

# GPU VLAN/VNI (plane 1)
gpu_vlan: 900
gpu_vni: 245900
gpu_vrf_name: GPU
gpu_evpn_vlan: 3003
gpu_evpn_vni: 245003

# VLAN 900 VRR (anycast gateway shared by all plane 1 leaves)
vlan900_vrr: 192.168.0.1/20

# GPU subnet (plane 1)
gpu_subnet: 192.168.0.0/20

# Port assignments
gpu_access_ports: "swp1-11"
isl_ports: "swp63-64"
breakout_ports: "swp1-11,63-64"

# Overlay peers (E/W plane 1 spines)
overlay_peers:
  - 10.1.1.5
  - 10.1.1.6

# Port classification (Wire Map derived)
gpu_subports: swp1s0,swp1s1,swp2s0,swp2s1,swp3s0,swp3s1,swp4s0,swp4s1,swp5s0,swp5s1,swp6s0,swp6s1,swp7s0,swp7s1,swp8s0,swp8s1,swp9s0,swp9s1,swp11s0
isl_subports: swp63s0,swp63s1,swp64s0,swp64s1
gpu_breakout_parents: swp1,swp2,swp3,swp4,swp5,swp6,swp7,swp8,swp9,swp11
isl_breakout_parents: swp63,swp64
