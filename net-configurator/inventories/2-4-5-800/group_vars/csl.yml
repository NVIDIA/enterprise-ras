# ============================================================================
# CSL (N/S Leaf) Group Variables - 2-4-5-800 Deployment
# ============================================================================
# N/S leaves handle DPU connections and multiple VRFs (OOB, INBAND, STORAGE)

# Port assignments (breakout 2x)
gpu_dpu_ports: "swp1-11,swp33-38"
isl_ports: "swp63-64"
breakout_ports: "swp1-11,33-38,63-64"

# VLANs carried on CSL leaf (INBAND + STORAGE only; OOB is on OOB switches)
vlans: [300, 400]
vnis:
  300: 245300
  400: 245400

# VRF definitions (INBAND + STORAGE only; OOB VRF is on OOB switches)
vrfs:
  INBAND:
    evpn_vlan: 3002
    vni: 245002
  STORAGE:
    evpn_vlan: 3005
    vni: 245005

# Overlay peers (N/S spines)
overlay_peers:
  - 172.16.1.2
  - 172.16.1.3

# Route map for underlay
underlay_route_map: WEIGHTED_ECMP

# ============================================================================
# BGP Routing Policies — referenced by vrf_config (including Excel-supplemented
# entries for OOB / EXIT). community_list 11 / OUTBOUND_ERA_PREFIXES / the
# *_FILTER route-maps mirror the ERA pattern used by 2-4-3-200 and 2-8-9-800.
# ============================================================================
community_list:
- id: '11'
  rule:
  - id: '100'
    action: permit
    community: '11:11'

route_map:
- id: BLOCK_VTEPS
  rule:
  - id: '10'
    action: deny
    match:
      - type: ip-prefix-list
        value: VTEP_PREFIXES
      - type: type
        value: ipv4
  - id: '20'
    action: permit
    match:
      - type: ip-prefix-list
        value: ALL_PREFIXES
      - type: type
        value: ipv4
- id: EXIT_FILTER
  rule:
  - id: '10'
    action: deny
    match:
      - type: ip-prefix-list
        value: EXIT_LOCAL_IF
      - type: type
        value: ipv4
  - id: '20'
    action: permit
    set:
      - type: community
        value: '11:11'
- id: INBAND_FILTER
  rule:
  - id: '5'
    action: deny
    match:
      - type: community-list
        value: '11'
  - id: '10'
    action: deny
    match:
      - type: ip-prefix-list
        value: OOB_PREFIXES
      - type: type
        value: ipv4
  - id: '15'
    action: deny
    match:
      - type: ip-prefix-list
        value: INBAND_LOCAL_IF
      - type: type
        value: ipv4
  - id: '20'
    action: permit
    match:
      - type: ip-prefix-list
        value: ALL_PREFIXES
      - type: type
        value: ipv4
- id: OOB_FILTER
  rule:
  - id: '5'
    action: deny
    match:
      - type: community-list
        value: '11'
  - id: '10'
    action: deny
    match:
      - type: ip-prefix-list
        value: INBAND_PREFIXES
      - type: type
        value: ipv4
  - id: '15'
    action: deny
    match:
      - type: ip-prefix-list
        value: OOB_LOCAL_IF
      - type: type
        value: ipv4
  - id: '20'
    action: permit
    match:
      - type: ip-prefix-list
        value: ALL_PREFIXES
      - type: type
        value: ipv4
- id: OUTBOUND_ERA_PREFIXES
  rule:
  - id: '10'
    action: permit
    match:
      - type: ip-prefix-list
        value: ERA_PREFIXES
      - type: type
        value: ipv4
- id: WEIGHTED_ECMP
  rule:
  - id: '10'
    action: permit
    set:
      - type: ext-community-bw
        value: multipaths

# VRF Configuration (N/S Leaves — INBAND + STORAGE only; OOB/EXIT auto-added
# by the parser from the Excel VRFs + DHCP Relay tables when present)
vrf_config:
- id: INBAND
  vlan: 3002
  vni: '245002'
  route_export: true
  bgp:
    address_family:
      ipv4_unicast:
        enable: on
        redistribute_connected: on
        route_export_to_evpn: on
      l2vpn_evpn:
        enable: on
# NOTE: STORAGE VRF is NOT declared here. It is emitted per-switch via the
# parser's vrf_config_extra path (excel_parser.py generate_host_vars), which
# defines the VRF wherever a STORAGE SVI or L3 storage uplink exists and binds
# the correct L3VNI VLAN (3005). Declaring it statically here too produced a
# duplicate, conflicting `nv set vrf STORAGE evpn vlan` block. Matches the
# 2-8-9-800 source inventory, which also omits a static STORAGE entry.

# Default VRF BGP (underlay ISL + overlay to spines)
default_vrf_bgp:
  address_family:
    ipv4_unicast:
      enable: on
      redistribute_connected: on
    l2vpn_evpn:
      enable: on
  neighbors:
    - interfaces: [swp63s0, swp63s1, swp64s0, swp64s1]
      peer_group: underlay
      type: unnumbered
    - interfaces: [172.16.1.2, 172.16.1.3]
      peer_group: overlay
      type: numbered
  peer_groups:
    - id: underlay
      remote_as: external
      address_family:
        ipv4_unicast:
          enable: on
    - id: overlay
      remote_as: external
      update_source: lo
      multihop_ttl: 2
      address_family:
        ipv4_unicast:
          enable: off
        l2vpn_evpn:
          enable: on
