# ============================================================================
# GSL-PLANE1-01 Host-Specific Variables - 2-8-9-800 Deployment
# ============================================================================
# GPU Spine/Leaf — Plane 1, Switch 1
ansible_host: 192.168.200.211
mac_address: 48:b0:2d:5d:21:c1
ip_assignment_mode: dhcp

# Identity
hostname: gsl-plane1-01
plane: 1
lo_ip: 10.1.1.1/32

# vlan900 GPU SVI (per-host IP, shared VRR with plane-mate)
vlan900_ip: 192.168.0.2/20

# GPU VRF loopback (per-host)
vrf_gpu_loopback: 10.1.1.11/32

# Plane-mate's lo IP for the overlay BGP peer
plane_mate_lo_ip: 10.1.1.2
