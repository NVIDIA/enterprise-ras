# ============================================================================
# ZTP Server Configuration 
# ============================================================================
# This configuration uses a SINGLE ZTP script for all switches.
# The script extracts hostname from DHCP and downloads the appropriate config.

# ZTP Server Details
ztp_server_ip: "169.254.0.2"  # Must match the interface where switches connect
ztp_server_host: "dhcp-oob"

# ZTP Server Network Interfaces
# Configure which interfaces the ZTP server listens on for DHCP/TFTP
configure_ztp_ips: true  # Set to true to let Ansible configure interface IPs
ztp_interfaces:
  - name: eth1
    ip: 192.168.200.252
    network: 192.168.200.0/24
    gateway: 192.168.200.1
    purpose: oob
    dnsmasq_listen: true

# DHCP Configuration
configure_dhcp: true
dhcp_domain_name: "era.local"
dhcp_range_start: "192.168.1.100"
dhcp_range_end: "192.168.1.200"
dhcp_lease_time: "12h"
dhcp_gateway: "192.168.1.1"
dnsmasq_interface: "ens3"  # Interface to listen on

# Cumulus Linux OS Management
cumulus_target_release: ""  # Set to enable automatic OS upgrades (e.g., "5.9.1")
cumulus_image_url: ""  # URL to Cumulus Linux binary image

# ZTP Features
ztp_enable_topology: false  # Prescriptive topology manager (PTMD)
ztp_enable_monitoring: false  # ASIC monitoring and histogram collection
ztp_monitoring_config: |
  # Add your monitoring configuration here
ztp_final_reboot: true  # Reboot after ZTP completes

# SSH Configuration
ssh_public_key_path: "~/.ssh/id_rsa.pub"

# Miscellaneous
# timezone is set per switch-group in group_vars/oob.yml and group_vars/core.yml
generate_configs: true
prompt_before_setup: false

