- name: netplan apply
  shell: nohup netplan apply &>/dev/null &
  async: 30
  poll: 0
  ignore_errors: true

- name: wait for network
  wait_for_connection:
    delay: 5
    timeout: 60
  ignore_errors: true

- name: reset ssh connection
  meta: reset_connection
