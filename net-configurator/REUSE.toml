# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: MIT
#
# Licensing for files that cannot carry an SPDX header of their own
# (REUSE Specification 3.3). Every other shipped source file carries the
# two-line header itself; tests/test_spdx_headers_cover_shipped_files.py enforces both halves.
version = 1

# Generated by `make import` / `make generate` from the MIT-licensed templates
# and the arch models. Regenerating would strip a hand-added header, so the
# notice lives here; files that do carry one (group_vars, configs) keep it.
[[annotations]]
path = ["output/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "MIT"

# Binary workbooks: shipped intake forms, documentation samples and test fixtures.
[[annotations]]
path = ["input/**.xlsx", "docs/optional-overrides.xlsx", "tests/fixtures/**.xlsx"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "MIT"

# Files whose format has no comment syntax the consumer accepts.
[[annotations]]
path = ["NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "MIT"
