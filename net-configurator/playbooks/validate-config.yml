#
# Config Validation via ZTP Server
# Compares generated NVUE config against running config on each switch.
# Runs from the ZTP server (dhcp-oob) as bastion.
#
# Required variable:
#   config_output_dir  - path to generated config files (e.g., ../output/2-8-5-200/default/configs)

- name: Validate Running Config vs Generated Config via ZTP Server
  hosts: jump
  gather_facts: false

  tasks:
    - name: Check if sshpass is installed
      command: which sshpass
      register: sshpass_check
      changed_when: false
      failed_when: false

    - name: Wait for dpkg lock to be released
      shell: while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done
      become: true
      changed_when: false
      timeout: 120
      when: sshpass_check.rc != 0

    - name: Install sshpass
      package:
        name: sshpass
        state: present
      become: true
      when: sshpass_check.rc != 0

    - name: Copy normalizer script to ZTP server
      copy:
        src: ../scripts/normalize_nvue.py
        dest: /tmp/normalize_nvue.py
        mode: '0755'

    - name: Get list of switches from inventory
      set_fact:
        # Use the 'switches' parent group (children: core, csl, gsl, oob)
        # so this works for both collapsed and dedicated_gpu architectures.
        switch_list: "{{ groups['switches'] | default([]) }}"
      delegate_to: localhost
      run_once: true

    - name: Read generated config for each switch
      set_fact:
        generated_configs: >-
          {{ generated_configs | default({}) | combine({
               item: lookup('file', config_output_dir ~ '/' ~ (hostvars[item].hostname | default(item)) ~ '-config.sh')
             })
          }}
      loop: "{{ switch_list }}"
      delegate_to: localhost
      run_once: true

    # Tell the operator the next step is a single, deliberately-quiet collection
    # so the dead air during the parallel fan-out doesn't read as a hang.
    - name: "Progress — pulling running configs in parallel"
      debug:
        msg: >-
          Pulling running NVUE config from {{ switch_list | length }} switch(es)
          in parallel via the jump. This runs as ONE step and stays quiet until
          every switch returns (up to a few minutes at scale) — silence here is
          expected, not a hang.
      run_once: true

    - name: "Pull running config from ALL switches in parallel (fan-out from jump)"
      # One backgrounded SSH per switch on the jump, then `wait` — parallel,
      # not the old serial loop. Parallelism happens inside this single shell
      # task (Ansible doesn't stream, but the whole thing finishes in seconds).
      # Per-switch output (CONNECTION_FAILED / CONFIG_FETCH_FAILED / config) is
      # emitted between @@@SW@@@<name> markers and reshaped into the original
      # running_configs contract below, so the compare task is unchanged.
      shell: |
        export SSHPASS='{{ switch_password }}'
        OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=10 -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
        WORK=$(mktemp -d /tmp/cfgv.XXXXXX)
        {% for item in switch_list %}
        ( if ! timeout 15 sshpass -e ssh $OPTS cumulus@{{ hostvars[item].ansible_host }} 'echo ok' >/dev/null 2>&1; then
            echo "CONNECTION_FAILED";
          else
            timeout 30 sshpass -e ssh $OPTS cumulus@{{ hostvars[item].ansible_host }} 'nv config show -o commands 2>/dev/null || nv config show --output commands 2>/dev/null || nv config show 2>/dev/null' || echo "CONFIG_FETCH_FAILED";
          fi ) > "$WORK/{{ item }}.out" 2>/dev/null &
        {% endfor %}
        wait
        {% for item in switch_list %}
        echo "@@@SW@@@{{ item }}"
        cat "$WORK/{{ item }}.out" 2>/dev/null
        {% endfor %}
        rm -rf "$WORK"
      register: cfg_fanout
      changed_when: false
      no_log: true

    - name: Reshape parallel output into running_configs (preserves contract)
      set_fact:
        _rc: "{{ (_rc | default([])) + [ {'item': (item.split('\n')[0]), 'stdout': (item.split('\n')[1:] | join('\n')), 'stdout_lines': (item.split('\n')[1:])} ] }}"
      loop: "{{ cfg_fanout.stdout.split('@@@SW@@@') | reject('equalto', '') | list }}"
      loop_control:
        label: "{{ item.split('\n')[0] }}"
      # Accumulating fact carries every switch's full config — without no_log
      # Ansible reprints the growing fact each iteration -> O(N^2) output blowup.
      no_log: true

    - name: Publish running_configs
      set_fact:
        running_configs: "{{ {'results': _rc | default([])} }}"

    - name: Compare and format results for each switch
      shell: |
        SWITCH="{{ item.item }}"
        HOST="{{ hostvars[item.item].ansible_host }}"
        STATUS="{{ item.stdout_lines[0] | default('') }}"

        echo "=========================================="
        echo "Switch: ${SWITCH} (${HOST})"
        echo "=========================================="

        if [ "$STATUS" = "CONNECTION_FAILED" ]; then
          echo "RESULT:FAILED"
          echo "!! CONNECTION FAILED -- could not SSH to switch"
          exit 0
        fi

        if [ "$STATUS" = "CONFIG_FETCH_FAILED" ]; then
          echo "RESULT:FAILED"
          echo "!! CONFIG FETCH FAILED -- SSH ok but nv config show failed"
          exit 0
        fi

        # Write generated config
        cat <<'GENERATED_EOF' > /tmp/gen_${SWITCH}.txt
        {{ generated_configs[item.item] }}
        GENERATED_EOF

        # Write running config
        cat <<'RUNNING_EOF' > /tmp/run_${SWITCH}.txt
        {{ item.stdout }}
        RUNNING_EOF

        # Normalize both through the Python normalizer
        # This expands interface ranges/groups into individual lines
        python3 /tmp/normalize_nvue.py < /tmp/gen_${SWITCH}.txt > /tmp/gen_norm_${SWITCH}.txt
        python3 /tmp/normalize_nvue.py < /tmp/run_${SWITCH}.txt > /tmp/run_norm_${SWITCH}.txt

        gen_count=$(wc -l < /tmp/gen_norm_${SWITCH}.txt)
        run_count=$(wc -l < /tmp/run_norm_${SWITCH}.txt)

        # Lines in generated but not in running (MISSING from switch)
        # Filter out lines where running config has a hashed/encrypted version (passwords, secrets)
        comm -23 /tmp/gen_norm_${SWITCH}.txt /tmp/run_norm_${SWITCH}.txt > /tmp/missing_raw_${SWITCH}.txt
        grep -v -E '(ldap secret|ldap bind-password|password)' \
          /tmp/missing_raw_${SWITCH}.txt > /tmp/missing_${SWITCH}.txt || true
        missing_count=$(wc -l < /tmp/missing_${SWITCH}.txt)

        # Lines in running but not in generated (EXTRA on switch)
        comm -13 /tmp/gen_norm_${SWITCH}.txt /tmp/run_norm_${SWITCH}.txt > /tmp/extra_raw_${SWITCH}.txt

        # Filter out known NVUE defaults/system-managed lines and hashed secrets from extras.
        # eth0 ipv4 address is the runtime mgmt IP, set by DHCP in ZTP mode or
        # by the deferred-apply NI in NOZTP mode -- never in the rendered config.
        # `interface swpN type swp` is the implicit per-port default that
        # Cumulus 5.16+ materializes in the running config; our generator
        # doesn't emit it because it's the schema default.
        # `nve vxlan enable on` is implicitly enabled by NVUE when EVPN
        # address-family is configured in BGP; we never emit it in the
        # generated config, so filter it out of the extras here.
        grep -v -E '(dhcp-client|interface eth0 ipv4 address|hashed-password|system docker|association-type server|system ntp vrf|ldap secret|ldap bind-password|nv set interface swp[0-9]+(s[0-9]+)? type swp$|nv set nve vxlan enable on$|nv set nve vxlan state enabled$)' \
          /tmp/extra_raw_${SWITCH}.txt > /tmp/extra_${SWITCH}.txt || true
        extra_count=$(wc -l < /tmp/extra_${SWITCH}.txt)
        ignored_count=$(( $(wc -l < /tmp/extra_raw_${SWITCH}.txt) + $(wc -l < /tmp/missing_raw_${SWITCH}.txt) - extra_count - missing_count ))

        echo "Generated commands:  ${gen_count}"
        echo "Running commands:    ${run_count}"
        echo "Missing on switch:   ${missing_count}"
        echo "Extra on switch:     ${extra_count}"
        if [ "$ignored_count" -gt 0 ]; then
          echo "Ignored (defaults): ${ignored_count}"
        fi

        # Guard against the "0/0 false MATCH" — if BOTH generated and running
        # normalize to zero lines, something silently failed (ansible compile
        # glitch, empty SSH return, normalizer crash). Flag it as FAILED, not
        # MATCH, so the operator notices instead of being misled.
        if [ "$gen_count" -eq 0 ] && [ "$run_count" -eq 0 ]; then
          echo "RESULT:FAILED"
          echo "!! EMPTY DIFF -- both generated and running config came back empty"
          echo "!! likely transient (utility race during boot) — re-run validate-config"
          exit 0
        fi

        if [ "$missing_count" -eq 0 ] && [ "$extra_count" -eq 0 ]; then
          echo "RESULT:MATCH"
          echo "[OK] MATCH -- running config matches generated config"
        else
          echo "RESULT:MISMATCH"
          if [ "$missing_count" -gt 0 ]; then
            echo ""
            echo "-- Missing from switch (in generated, not running) --"
            sed 's/^/  - /' /tmp/missing_${SWITCH}.txt | head -50
            if [ "$missing_count" -gt 50 ]; then
              echo "  ... and $((missing_count - 50)) more"
            fi
          fi
          if [ "$extra_count" -gt 0 ]; then
            echo ""
            echo "-- Extra on switch (in running, not generated) --"
            sed 's/^/  + /' /tmp/extra_${SWITCH}.txt | head -50
            if [ "$extra_count" -gt 50 ]; then
              echo "  ... and $((extra_count - 50)) more"
            fi
          fi
        fi

        # Full-detail dump appended below the SENTINEL so the on-screen
        # `debug` task can trim it out (it shows only the summary), while
        # the per-switch raw report file picks up the whole thing. Lets a
        # reader see exactly what got "Ignored (defaults)" — the missing/
        # extra lines + the unfiltered raw `comm -23 / -13` output + both
        # full configs (generated + running).
        echo ""
        echo "===RAW-DETAIL==="
        echo ""
        echo "-- Lines filtered as defaults (running has, ignored as NVUE auto) --"
        comm -13 /tmp/extra_${SWITCH}.txt /tmp/extra_raw_${SWITCH}.txt | sed 's/^/  ~ /' || true
        echo ""
        echo "-- Lines filtered from missing (secrets/passwords) --"
        comm -13 /tmp/missing_${SWITCH}.txt /tmp/missing_raw_${SWITCH}.txt | sed 's/^/  ~ /' || true
        echo ""
        echo "===FULL-GENERATED==="
        cat /tmp/gen_${SWITCH}.txt
        echo ""
        echo "===FULL-RUNNING==="
        cat /tmp/run_${SWITCH}.txt

        # Cleanup
        rm -f /tmp/gen_${SWITCH}.txt /tmp/run_${SWITCH}.txt \
              /tmp/gen_norm_${SWITCH}.txt /tmp/run_norm_${SWITCH}.txt \
              /tmp/missing_${SWITCH}.txt /tmp/missing_raw_${SWITCH}.txt \
              /tmp/extra_raw_${SWITCH}.txt /tmp/extra_${SWITCH}.txt
      loop: "{{ running_configs.results }}"
      register: diff_results
      changed_when: false
      no_log: true

    - name: Display results for each switch
      debug:
        # Trim the on-screen output at the RAW-DETAIL sentinel — the raw
        # report file (config-<sw>.txt) still gets the full content below.
        msg: >-
          {{ item.stdout_lines[:item.stdout_lines.index('===RAW-DETAIL===')]
             if '===RAW-DETAIL===' in item.stdout_lines
             else item.stdout_lines }}
      loop: "{{ diff_results.results }}"
      loop_control:
        label: "{{ item.item.item }}"

    - name: Calculate summary
      set_fact:
        total_switches: "{{ switch_list | length }}"
        match_count: "{{ diff_results.results | selectattr('stdout', 'search', 'RESULT:MATCH') | list | length }}"
        fail_count: "{{ diff_results.results | selectattr('stdout', 'search', 'RESULT:FAILED') | list | length }}"
        mismatch_count: "{{ diff_results.results | selectattr('stdout', 'search', 'RESULT:MISMATCH') | list | length }}"
      run_once: true

    - name: Display summary
      debug:
        msg:
          - "=========================================="
          - "CONFIG VALIDATION SUMMARY"
          - "=========================================="
          - "Total Switches:        {{ total_switches }}"
          - "Config Match:          {{ match_count }}"
          - "Config Mismatch:       {{ mismatch_count }}"
          - "Connection Failed:     {{ fail_count }}"
          - "=========================================="
      run_once: true

    - name: Write structured config validation report (summary)
      copy:
        content: |
          ╔══════════════════════════════════════════════════════════════════════╗
          ║       ERA Switch Config Validation Report                            ║
          ║       (running NVUE config vs generated)                             ║
          ╚══════════════════════════════════════════════════════════════════════╝

          Switches checked: {{ total_switches }}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          {% for item in diff_results.results %}
          {% set switch = item.item.item %}
          {% set lines = item.stdout_lines | default([]) %}
          {% set result_line = (lines | select('match', '^RESULT:') | list | first | default('RESULT:UNKNOWN')) %}
          {% set result = result_line | replace('RESULT:', '') %}
          {% set gen   = (lines | select('match', '^Generated commands:') | list | first | default('') | regex_search('\d+')) | default('?') %}
          {% set run   = (lines | select('match', '^Running commands:')   | list | first | default('') | regex_search('\d+')) | default('?') %}
          {% set miss  = (lines | select('match', '^Missing on switch:')  | list | first | default('') | regex_search('\d+')) | default('?') %}
          {% set extra = (lines | select('match', '^Extra on switch:')    | list | first | default('') | regex_search('\d+')) | default('?') %}
          {% if result == 'MATCH' %}{% set marker = '✅' %}{% elif result == 'MISMATCH' %}{% set marker = '❌' %}{% else %}{% set marker = '⚠️ ' %}{% endif %}
          {{ marker }} {{ "%-15s" | format(switch) }} {{ "%-9s" | format(result) }}  generated={{ gen }}  running={{ run }}  missing={{ miss }}  extra={{ extra }}
          {% endfor %}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          SUMMARY:
            Total Switches:    {{ total_switches }}
            Config Match:      {{ match_count }}
            Config Mismatch:   {{ mismatch_count }}
            Connection Failed: {{ fail_count }}

          {% if (mismatch_count | int + fail_count | int) == 0 %}
          ✅ ALL SWITCHES PASSED CONFIG VALIDATION
          {% else %}
          ❌ {{ mismatch_count }} mismatch(es), {{ fail_count }} unreachable
          {% endif %}

          Per-switch diff details (full Missing / Extra command lists when
          a switch MISMATCHes) live in {{ report_file | dirname }}/raw/.
        dest: "{{ report_file | default('/tmp/era-config-validation-report.txt') }}"
        mode: '0644'
      delegate_to: localhost
      run_once: true

    # ── Per-switch raw diff details → reports/raw/ (audit detail) ──
    - name: Compute raw output directory
      set_fact:
        raw_report_dir: "{{ report_file | dirname }}/raw"
      delegate_to: localhost
      run_once: true

    - name: Ensure raw output directory exists
      file:
        path: "{{ raw_report_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Write per-switch raw config diff files
      copy:
        dest: "{{ raw_report_dir }}/config-{{ item.item.item }}.txt"
        mode: '0644'
        content: |
          {{ item.item.item }}
          Captured during validate-config

          {% for line in item.stdout_lines %}
          {{ line }}
          {% endfor %}
      loop: "{{ diff_results.results }}"
      loop_control:
        label: "{{ item.item.item }}"
      when: item.stdout_lines is defined
      delegate_to: localhost

    - name: Fail if any mismatch or failure
      fail:
        msg: "{{ mismatch_count }} mismatched, {{ fail_count }} unreachable"
      when: (mismatch_count | int + fail_count | int) > 0
      run_once: true

    - name: Cleanup normalizer script
      file:
        path: /tmp/normalize_nvue.py
        state: absent
