# ZTP Validation via Bastion (ZTP Server)
# This playbook runs validation commands from the ZTP server to reach switches

- name: Validate ZTP Configuration via ZTP Server
  hosts: jump
  gather_facts: false

  tasks:
    - name: Check if sshpass is installed
      command: which sshpass
      register: sshpass_check
      changed_when: false
      failed_when: false

    - name: Wait for dpkg lock to be released
      shell: while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done
      become: true
      changed_when: false
      timeout: 120
      when: sshpass_check.rc != 0

    - name: Install sshpass
      package:
        name: sshpass
        state: present
      become: true
      when: sshpass_check.rc != 0

    - name: Get list of switches from inventory
      set_fact:
        # Use the 'switches' parent group (children: core, csl, gsl, oob)
        # so the same playbook works for collapsed (core) and dedicated_gpu (csl/gsl) archs.
        switch_list: "{{ groups['switches'] | default([]) }}"
      delegate_to: localhost
      run_once: true

    # yamllint disable rule:line-length
    # The shell block inlines a 10-way group_names role gate (cl/cs/gl/gs +
    # legacy core/csl/gsl) into a few Jinja {% if %}/echo lines. These live
    # inside a literal block scalar, so wrapping them would inject newlines
    # into the rendered bash and break it. Scope line-length off for this task.
    - name: Copy ZTP collection probe to the jump
      copy:
        src: "{{ playbook_dir }}/../scripts/ztp_collect_probe.sh"
        dest: /tmp/ztp_collect_probe.sh
        mode: "0755"

    # Tell the operator the next step is a single, deliberately-quiet collection
    # so the dead air during the parallel fan-out doesn't read as a hang.
    - name: "Progress — collecting switch state in parallel"
      debug:
        msg: >-
          Collecting NVUE / BGP / EVPN state from {{ switch_list | length }}
          switch(es) in parallel via the jump. This runs as ONE step and stays
          quiet until every switch returns (up to a few minutes at scale) —
          silence here is expected, not a hang.
      run_once: true

    # Parallel fan-out: one backgrounded `probe &` per switch, then `wait`. The
    # probe (a file) holds the ~19-command collection, so this loop stays tiny —
    # avoiding the ARG_MAX limit a jinja-unrolled inline mega-script hit at scale.
    # Per-switch output is delimited by @@@SW@@@<name> and reshaped below into the
    # original validation_results contract, so downstream tasks are unchanged.
    - name: Collect from all switches in parallel (fan-out of probe calls)
      shell: |
        WORK=$(mktemp -d /tmp/ztpv.XXXXXX)
        {% for item in switch_list %}
        bash /tmp/ztp_collect_probe.sh '{{ hostvars[item].ansible_host }}' '{{ switch_password }}' '{% if 'core' in hostvars[item].group_names or 'csl' in hostvars[item].group_names or 'gsl' in hostvars[item].group_names or 'cl' in hostvars[item].group_names or 'cs' in hostvars[item].group_names or 'gl' in hostvars[item].group_names or 'gs_plane1' in hostvars[item].group_names or 'gs_plane2' in hostvars[item].group_names or 'gl_plane1' in hostvars[item].group_names or 'gl_plane2' in hostvars[item].group_names %}1{% else %}0{% endif %}' > "$WORK/{{ item }}.out" 2>/dev/null &
        {% endfor %}
        wait
        {% for item in switch_list %}
        echo "@@@SW@@@{{ item }}"
        cat "$WORK/{{ item }}.out" 2>/dev/null
        {% endfor %}
        rm -rf "$WORK"
      register: ztp_fanout
      changed_when: false
      no_log: true
    # yamllint enable rule:line-length

    # Reshape the combined fan-out output (per-switch blocks delimited by
    # @@@SW@@@<name>) back into the original contract so every downstream task is
    # unchanged: validation_results.results = [{item, stdout, stdout_lines}].
    - name: Reshape parallel output into validation_results
      set_fact:
        _vr: "{{ (_vr | default([])) + [ {'item': (item.split('\n')[0]), 'stdout': (item.split('\n')[1:] | join('\n')), 'stdout_lines': (item.split('\n')[1:])} ] }}"
      loop: "{{ ztp_fanout.stdout.split('@@@SW@@@') | reject('equalto', '') | list }}"
      loop_control:
        label: "{{ item.split('\n')[0] }}"
      # Accumulating fact carries every switch's full config — without no_log
      # Ansible reprints the growing fact each iteration -> O(N^2) output blowup.
      no_log: true

    - name: Publish validation_results
      set_fact:
        validation_results: "{{ {'results': _vr | default([])} }}"

    - name: Calculate summary statistics
      set_fact:
        total_switches: "{{ validation_results.results | length }}"
        successful_switches: "{{ validation_results.results | selectattr('stdout', 'search', 'RESULT\\|SUCCESS') | list | length }}"
      run_once: true

    # yamllint disable rule:line-length
    # The report template's BGP/EVPN section reuses the same 10-way group_names
    # role gate on a single Jinja {% if %} line inside a literal block scalar;
    # wrapping it would inject newlines into the rendered report. Scope off.
    - name: Write validation report
      copy:
        content: |
          ╔══════════════════════════════════════════════════════════════╗
          ║  ERA ZTP Validation Report (via ZTP server)                 ║
          ║  {{ '%Y-%m-%d %H:%M:%S' | strftime }}                                            ║
          ╚══════════════════════════════════════════════════════════════╝

          {% for item in validation_results.results %}
          {% set result_line = item.stdout_lines | select('match', '^RESULT\\|') | list | first %}
          {% set r = result_line.split('|') %}
          ┌──────────────────────────────────────────────────────────────
          │ {{ item.item }}  ({{ hostvars[item.item].ansible_host }})
          └──────────────────────────────────────────────────────────────
          {% if r[1] == 'SUCCESS' %}
            SSH Reachable:            ✓ Yes
            Hostname:                 {{ '✓' if r[2] == (hostvars[item.item].hostname | default(item.item)) else '✗' }} {{ r[2] }}
            Cumulus Version:          {{ r[3] }}
            NVUE Config:              {{ r[4] }}
            Bridge Domains:           {{ r[5] }}
            Interfaces Up:            {{ r[6] }}
          {# Same broad gate as the capture-side conditionals so cl/cs/gl/gs
             switches also get BGP state shown in the report. #}
          {% if 'core' in hostvars[item.item].group_names or 'csl' in hostvars[item.item].group_names or 'gsl' in hostvars[item.item].group_names or 'cl' in hostvars[item.item].group_names or 'cs' in hostvars[item.item].group_names or 'gl' in hostvars[item.item].group_names or 'gs_plane1' in hostvars[item.item].group_names or 'gs_plane2' in hostvars[item.item].group_names or 'gl_plane1' in hostvars[item.item].group_names or 'gl_plane2' in hostvars[item.item].group_names %}
            BGP State:                {{ r[7] | default('N/A') }}
            BGP Configured Neighbors: {{ r[8] | default('0') }}
            BGP Established Neighbors:{{ r[9] | default('0') }}
          {% set _down = (r[8] | default(0) | int) - (r[9] | default(0) | int) %}
          {% if _down > 0 %}
            BGP Sessions Down:        ⚠ {{ _down }}
          {% if r[12] is defined and (r[12] | trim) %}
          {% for _entry in r[12].split(',') %}
          {% set _port = _entry.split(':')[0] %}
              └─ {{ _port }}
          {% endfor %}
          {% endif %}
          {% endif %}
            EVPN L2 VNIs:             {{ r[10] | default('0') }}
            EVPN L3 VNIs:             {{ r[11] | default('0') }}
          {% endif %}
          {% else %}
            SSH Reachable:            ✗ No
            Status:                   FAILED — switch unreachable
          {% endif %}
          {% endfor %}

          ══════════════════════════════════════════════════════════════
          SUMMARY:  {{ successful_switches }}/{{ total_switches }} switches passed
          {% if successful_switches | int == total_switches | int %}
          RESULT:   ✅ ALL SWITCHES VALIDATED SUCCESSFULLY
          {% else %}
          RESULT:   ❌ {{ total_switches | int - successful_switches | int }} SWITCH(ES) FAILED
          {% endif %}
          ══════════════════════════════════════════════════════════════

          Per-switch raw `nv show` output (bridge, interface, vrf, ntp,
          lldp, bgp, evpn, qos_roce, running config) lives in
          {{ report_file | dirname }}/raw/.
        dest: "{{ report_file | default('/tmp/era-ztp-validation-report.txt') }}"
      delegate_to: localhost
      run_once: true
    # yamllint enable rule:line-length

    # ── Per-switch raw nv show output → reports/raw/ (audit detail) ──
    - name: Compute raw output directory
      set_fact:
        raw_report_dir: "{{ report_file | dirname }}/raw"
      delegate_to: localhost
      run_once: true

    - name: Ensure raw output directory exists
      file:
        path: "{{ raw_report_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Write per-switch raw nv show output files
      copy:
        dest: "{{ raw_report_dir }}/ztp-{{ item.item }}.txt"
        mode: '0644'
        content: |
          {{ item.item }}  ({{ hostvars[item.item].ansible_host }})
          Captured during validate-ztp, {{ '%Y-%m-%d %H:%M:%S' | strftime }}

          {% for line in item.stdout_lines %}
          {% if line.startswith('---RAW:') %}

          === {{ line | replace('---RAW:', '') | replace('---', '') }} ===
          {% elif not line.startswith('RESULT|') %}
          {{ line }}
          {% endif %}
          {% endfor %}
      loop: "{{ validation_results.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stdout is defined
        - "'SUCCESS' in (item.stdout_lines | select('match', '^RESULT\\\\|') | list | first | default(''))"
      delegate_to: localhost

    - name: Fail if any validation failed
      fail:
        msg: "⚠️  {{ total_switches | int - successful_switches | int }} switches failed validation"
      when: successful_switches | int < total_switches | int
      run_once: true
