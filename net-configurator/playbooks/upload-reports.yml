- name: Upload validation reports to status-page server
  # Target the [jump] group, not [dhcp]. In L2 mode both resolve to
  # the same host (dhcp-oob is in both groups), so this is a no-op
  # change there. In L3 mode [dhcp]=external-dhcp but [jump]=utility,
  # and the status page (with /var/www/ztp/reports/ served by nginx)
  # lives on utility — see _l3_oob_metadata.status_page_host. Without
  # this switch, the per-host raw reports land on the wrong host in
  # L3 mode and never show up at the status page URL.
  hosts: jump
  become: yes
  gather_facts: no

  tasks:
    - name: Ensure reports directory exists
      file:
        path: /var/www/ztp/reports
        state: directory
        mode: '0755'
        owner: www-data
        group: www-data

    # SECURITY: only the top-level *summary* reports are published to the
    # status page. The per-host raw/ files (config-<sw>.txt) intentionally
    # contain FULL generated + running switch configs, including the lines
    # validate-config filters as "secrets/passwords" (LDAP bind secret,
    # cumulus password, hashed-password). Publishing those to the nginx
    # status page — basic-auth over plain HTTP in Air — would leak them, so
    # raw/ is NOT uploaded. Operators read raw detail locally from
    # {{ reports_dir }}/raw/ on the controller. (See issue #32 / ADR-0016.)
    - name: Upload top-level summary report files (no secrets)
      copy:
        src: "{{ item }}"
        dest: /var/www/ztp/reports/
        mode: '0644'
        owner: www-data
        group: www-data
      with_fileglob:
        - "{{ reports_dir }}/*"
