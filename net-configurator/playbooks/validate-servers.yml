#
# Server Architecture Validation Playbook
# Validates server network configuration, connectivity, and services
# Runs from dhcp-oob bastion host, SSHing to each server node
#
# Usage:
#   make validate-servers ARCH=2-8-5-200
#   ansible-playbook playbooks/validate-servers.yml -i <inventory>/hosts

- name: Validate server architecture
  hosts: jump
  gather_facts: false
  vars:
    server_groups: "{{ groups.get('nodes', []) + groups.get('storage', []) + groups.get('support', []) }}"
    report_file: "/tmp/era-server-validation-report.txt"
  tasks:

    - name: Ensure sshpass is available
      command: which sshpass
      changed_when: false
      failed_when: false
      register: sshpass_check

    - name: Install sshpass if missing
      apt:
        name: sshpass
        state: present
      when: sshpass_check.rc != 0
      become: true

    - name: Copy server validation probe to the jump
      copy:
        src: "{{ playbook_dir }}/../scripts/server_validate_probe.sh"
        dest: /tmp/server_validate_probe.sh
        mode: "0755"

    # Tell the operator the next step is a single, deliberately-quiet collection
    # so the dead air during the parallel fan-out doesn't read as a hang.
    - name: "Progress — validating servers in parallel"
      debug:
        msg: >-
          Validating bonds / VLANs / connectivity on {{ server_groups | length }}
          server(s) in parallel via the jump. This runs as ONE step and stays
          quiet until every server returns (up to a few minutes at scale) —
          silence here is expected, not a hang.
      run_once: true

    # Parallel fan-out: one backgrounded `probe &` per server, then `wait`. The
    # probe (a file) holds the gather + ping logic; jinja computes each server's
    # SRC_IP / EXPECTED_GW / ROLE from devices/groups/common (preserving the
    # original independent-if precedence: storage < support < gpu < compute) and
    # passes them as args. Per-server output (RESULT|... + ---RAW:---) is
    # reshaped into the original validation_results contract below, so every
    # downstream task (parse, report, raw files, cross-ping) is unchanged.
    # Serial loop over 155 servers (~8 SSH each) -> all concurrent.
    - name: Validate all servers in parallel (fan-out of probe calls)
      shell: |
        WORK=$(mktemp -d /tmp/srvv.XXXXXX)
        {% for item in server_groups %}
        {% set src_dev = devices.get(item, {}) %}
        {% set src_is_compute = item.startswith('su-') or item.startswith('node-') or item.startswith('gpu-') %}
        {% set src_inband_ip = (src_dev.get('bond_ip', '') if src_is_compute else src_dev.get('bond_ip1', '')) | regex_replace('/.*', '') %}
        {% set _gw = '' %}
        {% set _role = 'unknown' %}
        {% if item in groups.get('storage', []) %}{% set _gw = common.storage_gateway | default('') %}{% set _role = 'storage' %}{% endif %}
        {% if item in groups.get('support', []) %}{% set _gw = common.support_gateway | default('') %}{% set _role = 'support' %}{% endif %}
        {% if src_dev.get('gpu_interfaces') or src_dev.get('gpu_ips') %}{% set _gw = common.cpu_gateway | default('') %}{% set _role = 'gpu' %}{% endif %}
        {% if item in groups.get('nodes', []) and not (src_dev.get('gpu_interfaces') or src_dev.get('gpu_ips')) %}{% set _gw = common.cpu_gateway | default('') %}{% set _role = 'compute' %}{% endif %}
        bash /tmp/server_validate_probe.sh '{{ hostvars[item].ansible_host }}' '{{ server_ansible_password }}' '{{ item }}' '{{ src_inband_ip }}' '{{ _gw }}' '{{ _role }}' '{{ server_ansible_user | default('ubuntu') }}' > "$WORK/{{ item }}.out" 2>/dev/null &
        {% endfor %}
        wait
        {% for item in server_groups %}
        echo "@@@SW@@@{{ item }}"
        cat "$WORK/{{ item }}.out" 2>/dev/null
        {% endfor %}
        rm -rf "$WORK"
      register: srv_fanout
      changed_when: false
      no_log: true

    - name: Reshape parallel output into validation_results (preserves contract)
      set_fact:
        _sr: "{{ (_sr | default([])) + [ {'item': (item.split('\n')[0]), 'stdout': (item.split('\n')[1:] | join('\n')), 'stdout_lines': (item.split('\n')[1:])} ] }}"
      loop: "{{ srv_fanout.stdout.split('@@@SW@@@') | reject('equalto', '') | list }}"
      loop_control:
        label: "{{ item.split('\n')[0] }}"
      # Accumulating fact carries every server's full output — without no_log
      # Ansible reprints the growing fact each iteration -> O(N^2) output blowup.
      no_log: true

    - name: Publish validation_results
      set_fact:
        validation_results: "{{ {'results': _sr | default([])} }}"

    - name: Parse and display results
      set_fact:
        # Use ONLY the RESULT line for splitting — every field of the per-server
        # SSH-emitted RESULT is delimited by '|', but the final field (all_ips)
        # has no trailing '|', so splitting item.stdout would let the appended
        # `---RAW:...` blocks bleed into it. Selecting the RESULT line first
        # keeps the split bounded.
        server_results: >-
          {%- set _line = item.stdout_lines | select('match', '^RESULT\\|') | list | first | default('') -%}
          {%- set _f = _line.split('|') -%}
          {{ server_results | default([]) + [{
            'name': _f[1] | default(''),
            'status': _f[2] | default(''),
            'ip': _f[3] | default(''),
            'hostname': _f[4] | default(''),
            'eth0_ip': _f[5] | default(''),
            'bond_mode': _f[6] | default(''),
            'bond_active': _f[7] | default(''),
            'vlan_ifaces': _f[8] | default(''),
            'lldpd': _f[9] | default(''),
            'gw_ping': _f[10] | default(''),
            'oob_ping': _f[11] | default(''),
            'inet_ping': _f[12] | default(''),
            'role': _f[13] | default(''),
            'all_ips': _f[14] | default(''),
          }] }}
      loop: "{{ validation_results.results }}"
      when: item.stdout is defined and 'RESULT|' in item.stdout
      no_log: true

    # ── Cross-ping matrix: one pair per VLAN + one cross-VLAN ──
    # Compute VLAN is called `cpu_vlan` on 2-8-9-800 but `inband_vlan` on
    # 2-4-5-800 (different arch naming convention). Not every arch declares
    # a support VLAN either. Use defaults() to tolerate both naming
    # conventions and skip ping pairs whose VLAN isn't defined for this arch.
    - name: Build cross-ping test list
      set_fact:
        cross_pings: |
          {% set tests = [] %}
          {% set nodes_list = groups.get('nodes', []) %}
          {% set storage_list = groups.get('storage', []) %}
          {% set support_list = groups.get('support', []) %}
          {% set compute_vlan = common.cpu_vlan | default(common.inband_vlan | default(None)) %}
          {% set support_vlan = common.support_vlan | default(None) %}
          {% set storage_vlan = common.storage_vlan | default(None) %}
          {% if nodes_list | length >= 2 and compute_vlan %}
          {%   set _ = tests.append({'from': nodes_list[0], 'to': nodes_list[1], 'label': 'Compute ↔ Compute (VLAN ' ~ compute_vlan ~ ')', 'src_ip': devices[nodes_list[0]].bond_ip | default('') | regex_replace('/.*', ''), 'to_ip': devices[nodes_list[1]].bond_ip | default('') | regex_replace('/.*', '')}) %}
          {% endif %}
          {% if storage_list | length >= 2 and storage_vlan %}
          {%   set _ = tests.append({'from': storage_list[0], 'to': storage_list[1], 'label': 'Storage ↔ Storage (VLAN ' ~ storage_vlan ~ ')', 'src_ip': devices[storage_list[0]].bond_ip1 | default('') | regex_replace('/.*', ''), 'to_ip': devices[storage_list[1]].bond_ip1 | default('') | regex_replace('/.*', '')}) %}
          {% endif %}
          {% if support_list | length >= 2 and support_vlan %}
          {%   set _ = tests.append({'from': support_list[0], 'to': support_list[1], 'label': 'Support ↔ Support (VLAN ' ~ support_vlan ~ ')', 'src_ip': devices[support_list[0]].bond_ip1 | default('') | regex_replace('/.*', ''), 'to_ip': devices[support_list[1]].bond_ip1 | default('') | regex_replace('/.*', '')}) %}
          {% endif %}
          {% if support_list | length >= 1 and nodes_list | length >= 1 and support_vlan and compute_vlan %}
          {%   set _ = tests.append({'from': support_list[0], 'to': nodes_list[0], 'label': 'Cross-VLAN: Support → Compute (VLAN ' ~ support_vlan ~ ' → ' ~ compute_vlan ~ ')', 'src_ip': devices[support_list[0]].bond_ip1 | default('') | regex_replace('/.*', ''), 'to_ip': devices[nodes_list[0]].bond_ip | default('') | regex_replace('/.*', '')}) %}
          {% endif %}
          {{ tests | to_json }}

    - name: Run cross-ping tests
      shell: |
        export SSHPASS='{{ server_ansible_password }}'
        FROM_HOST='{{ hostvars[item.from].ansible_host }}'
        SSH_CMD="sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 {{ server_ansible_user | default('ubuntu') }}@$FROM_HOST"
        TO_IP='{{ item.to_ip }}'
        SRC_IP='{{ item.src_ip }}'
        LABEL='{{ item.label }}'

        if [ -z "$TO_IP" ] || [ -z "$SRC_IP" ]; then
          echo "XPING|$LABEL|SKIP|{{ item.from }}|{{ item.to }}|no IP"
          exit 0
        fi

        RESULT=$($SSH_CMD "ping -c 1 -W 3 $TO_IP -I $SRC_IP >/dev/null 2>&1; ping -c 2 -W 5 $TO_IP -I $SRC_IP 2>&1" 2>/dev/null)
        if echo "$RESULT" | grep -q "bytes from"; then
          echo "XPING|$LABEL|PASS|{{ item.from }}|{{ item.to }}|$TO_IP"
        else
          echo "XPING|$LABEL|FAIL|{{ item.from }}|{{ item.to }}|$TO_IP"
        fi
        echo "---XPING_RAW---"
        echo "$RESULT"
      loop: "{{ cross_pings | from_json }}"
      register: xping_results
      changed_when: false
      no_log: true

    - name: Parse cross-ping results
      set_fact:
        xping_parsed: >-
          {{ xping_parsed | default([]) + [{
            'label': item.stdout.split('|')[1],
            'status': item.stdout.split('|')[2],
            'from': item.stdout.split('|')[3],
            'to': item.stdout.split('|')[4],
            'to_ip': item.stdout.split('|')[5] | default(''),
          }] }}
      loop: "{{ xping_results.results }}"
      when: item.stdout is defined and 'XPING|' in item.stdout
      no_log: true

    - name: Generate validation report
      copy:
        dest: "/tmp/era-server-validation-report.txt"
        content: |
          ╔══════════════════════════════════════════════════════════════════════╗
          ║               ERA Server Architecture Validation Report              ║
          ╚══════════════════════════════════════════════════════════════════════╝

          Timestamp: {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}
          Servers checked: {{ server_results | length }}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          {% set ns = namespace(pass=0, fail=0, unreachable=0) %}
          {% for s in server_results %}
          {% if s.status == 'UNREACHABLE' %}
          {% set ns.unreachable = ns.unreachable + 1 %}
          ❌ {{ "%-20s" | format(s.name) }} UNREACHABLE ({{ s.ip }})
          {% else %}
          {% set all_pass = (s.gw_ping == 'PASS' or s.gw_ping == 'SKIP') and s.eth0_ip != '' and s.lldpd == 'active' %}
          {% if all_pass %}{% set ns.pass = ns.pass + 1 %}{% else %}{% set ns.fail = ns.fail + 1 %}{% endif %}
          {{ "✅" if all_pass else "⚠️ " }} {{ "%-20s" | format(s.name) }} [{{ s.role }}]
             Hostname:    {{ s.hostname }}
             Interfaces:  {{ s.all_ips | default('none') }}
             Bond:        {{ s.bond_mode | default('none') }}{{ " (active: " + s.bond_active + ")" if s.bond_active else "" }}
             VLANs:       {{ s.vlan_ifaces | default('none') }}
             LLDP:        {{ s.lldpd }}{{ " ✅" if s.lldpd == 'active' else " ❌" }}
             Gateway:     {{ s.gw_ping }}{{ " ✅" if s.gw_ping == 'PASS' else (" ❌" if s.gw_ping == 'FAIL' else " ⏭️  (no data interfaces)") }}
             OOB (eth0):  {{ s.oob_ping }}{{ " ✅" if s.oob_ping == 'PASS' else (" ❌" if s.oob_ping == 'FAIL' else "") }}
             Internet:    {{ s.inet_ping }}{{ " ✅" if s.inet_ping == 'PASS' else (" ❌" if s.inet_ping == 'FAIL' else "") }}

          {% endif %}
          {% endfor %}
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          CROSS-PING TESTS (server ↔ server connectivity)
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          {% for x in xping_parsed | default([]) %}
          {{ "✅" if x.status == 'PASS' else ("❌" if x.status == 'FAIL' else "⏭️ ") }} {{ x.label }}
             {{ x.from }} → {{ x.to }} ({{ x.to_ip }}){{ "  ✅" if x.status == 'PASS' else ("  ❌" if x.status == 'FAIL' else "  SKIPPED") }}
          {% endfor %}
          {% if xping_parsed | default([]) | length == 0 %}
          (no cross-ping tests — need at least 2 servers per role)
          {% endif %}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          SUMMARY:  {{ ns.pass }} passed  |  {{ ns.fail }} issues  |  {{ ns.unreachable }} unreachable
                    out of {{ server_results | length }} servers
          {% set xping_pass = xping_parsed | default([]) | selectattr('status', 'equalto', 'PASS') | list | length %}
          {% set xping_fail = xping_parsed | default([]) | selectattr('status', 'equalto', 'FAIL') | list | length %}
          {% if xping_parsed | default([]) | length > 0 %}
          Cross-ping: {{ xping_pass }}/{{ xping_parsed | length }} passed
          {% endif %}

          {% if ns.fail == 0 and ns.unreachable == 0 %}
          ✅ All server validations passed!
          {% elif ns.unreachable > 0 %}
          ⚠️  Some servers were unreachable — they may still be booting.
             Retry with: make validate-servers ARCH=<arch>
          {% else %}
          ❌ Some checks failed — review the details above.
          {% endif %}

          NOTE: Each ping is preceded by a discarded warm-up + neighbor
          flush to absorb first-ARP and EVPN-MH bond-convergence latency.
          Per-server raw command output (ip / route / bond / lldp / ping
          replies) lives in {{ report_file | dirname }}/raw/.

          Re-run the validation if anything flaked:
            make validate-servers ARCH=<arch>
        mode: '0644'

    - name: Fetch report to local machine
      fetch:
        src: /tmp/era-server-validation-report.txt
        dest: "{{ report_file | default('/tmp/server-validation.txt') }}"
        flat: yes

    # ── Per-server / per-pair raw output → reports/raw/ (audit detail) ──
    - name: Compute raw output directory
      set_fact:
        raw_report_dir: "{{ report_file | dirname }}/raw"
      delegate_to: localhost
      run_once: true

    - name: Ensure raw output directory exists
      file:
        path: "{{ raw_report_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Write per-server raw output files
      copy:
        dest: "{{ raw_report_dir }}/server-{{ item.item }}.txt"
        mode: '0644'
        content: |
          {{ item.item }}  ({{ hostvars[item.item].ansible_host }})
          Captured during validate-servers, {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}

          {% for line in item.stdout_lines %}
          {% if line.startswith('---RAW:') %}

          === {{ line | replace('---RAW:', '') | replace('---', '') }} ===
          {% elif not line.startswith('RESULT|') %}
          {{ line }}
          {% endif %}
          {% endfor %}
      loop: "{{ validation_results.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stdout is defined
        - "'RESULT|' in item.stdout"
        - "'UNREACHABLE' not in item.stdout"
      delegate_to: localhost

    - name: Write combined cross-ping raw output file
      copy:
        dest: "{{ raw_report_dir }}/cross-pings.txt"
        mode: '0644'
        content: |
          Cross-ping raw output
          Captured during validate-servers, {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}

          {% for item in xping_results.results | default([]) %}
          {% if item.stdout is defined and 'XPING|' in item.stdout %}

          === {{ item.item.label }} ===
          From: {{ item.item.from }} ({{ item.item.src_ip }})
          To:   {{ item.item.to }} ({{ item.item.to_ip }})

          {% set raw_started = namespace(on=False) %}
          {% for line in item.stdout_lines %}
          {% if line == '---XPING_RAW---' %}{% set raw_started.on = True %}
          {% elif raw_started.on %}
          {{ line }}
          {% endif %}
          {% endfor %}
          {% endif %}
          {% endfor %}
      delegate_to: localhost
      run_once: true

    - name: Fail if any server unreachable, failing checks, or cross-ping failures
      vars:
        reachable: "{{ server_results | rejectattr('status', 'equalto', 'UNREACHABLE') | list }}"
        unreachable: "{{ server_results | selectattr('status', 'equalto', 'UNREACHABLE') | list }}"
        bad_gw: "{{ reachable | rejectattr('gw_ping', 'in', ['PASS', 'SKIP']) | map(attribute='name') | list }}"
        bad_eth0: "{{ reachable | selectattr('eth0_ip', 'equalto', '') | map(attribute='name') | list }}"
        bad_lldp: "{{ reachable | rejectattr('lldpd', 'equalto', 'active') | map(attribute='name') | list }}"
        with_issues: "{{ (bad_gw + bad_eth0 + bad_lldp) | unique | list }}"
        xping_fail: "{{ xping_parsed | default([]) | selectattr('status', 'equalto', 'FAIL') | list }}"
      fail:
        msg: "Server validation failed: {{ unreachable | length }} unreachable, {{ with_issues | length }} with issues, {{ xping_fail | length }} cross-ping failures"
      when: (unreachable | length > 0) or (with_issues | length > 0) or (xping_fail | length > 0)
      run_once: true
