- name: Generate NVUE CLI Format Configurations
  hosts: core:csl:gsl_plane1:gsl_plane2:oob
  gather_facts: false
  connection: local
  vars:
    config_output_dir: "../exported-configurations-cli"

  tasks:
    - name: Set timestamp fact
      set_fact:
        ansible_date_time:
          iso8601: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Create output directory
      file:
        path: "{{ config_output_dir }}"
        state: directory
        mode: '0755'
      run_once: true

    - name: Generate Core Switch CLI Configuration
      template:
        src: "../roles/core/templates/core_nvue_cli.j2"
        dest: "{{ config_output_dir }}/{{ hostname }}-config.sh"
        mode: '0755'
      when: "'core' in group_names"

    - name: Generate CSL Switch CLI Configuration
      template:
        src: "../roles/core/templates/core_nvue_cli.j2"
        dest: "{{ config_output_dir }}/{{ hostname }}-config.sh"
        mode: '0755'
      when: "'csl' in group_names"

    - name: Generate GSL Switch CLI Configuration
      template:
        src: "../roles/gsl/templates/gsl_nvue_cli.j2"
        dest: "{{ config_output_dir }}/{{ hostname }}-config.sh"
        mode: '0755'
      when: "'gsl_plane1' in group_names or 'gsl_plane2' in group_names"

    - name: Generate OOB Switch CLI Configuration
      template:
        src: "../roles/oob-switch/templates/oob_nvue_cli.j2"
        dest: "{{ config_output_dir }}/{{ hostname }}-config.sh"
        mode: '0755'
      when: "'oob' in group_names"

    - name: Collapse excessive blank lines in generated configs
      replace:
        path: "{{ config_output_dir }}/{{ hostname }}-config.sh"
        regexp: '\n{3,}'
        replace: '\n\n'

    - name: Display success message
      debug:
        msg: "✅ CLI configuration generated: {{ config_output_dir }}/{{ hostname }}-config.sh"
