- name: Generate NVUE CLI Format Configurations
  hosts: switches
  gather_facts: false
  connection: local
  vars:
    config_output_dir: "../exported-configurations-cli"

  tasks:
    - name: Set timestamp fact
      set_fact:
        ansible_date_time:
          iso8601: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Create output directory
      file:
        path: "{{ config_output_dir }}"
        state: directory
        mode: '0755'
      run_once: true

    - name: Generate Core/CSL/CL Switch CLI Configuration
      template:
        src: "../roles/core/templates/core_nvue_cli.j2"
        dest: "{{ config_output_dir }}/{{ hostname }}-config.sh"
        mode: '0755'
      when: "'core' in group_names or 'csl' in group_names or 'cl' in group_names"

    - name: Generate GSL/GL Leaf CLI Configuration
      template:
        src: "../roles/gl/templates/gl_nvue_cli.j2"
        dest: "{{ config_output_dir }}/{{ hostname }}-config.sh"
        mode: '0755'
      when: >
        'gsl_plane1' in group_names or 'gsl_plane2' in group_names or
        'gl_plane1' in group_names or 'gl_plane2' in group_names

    - name: Generate Spine (cs/gs) CLI Configuration
      template:
        src: "../roles/spine/templates/spine_nvue_cli.j2"
        dest: "{{ config_output_dir }}/{{ hostname }}-config.sh"
        mode: '0755'
      when: >
        'cs' in group_names or
        'gs_plane1' in group_names or 'gs_plane2' in group_names

    - name: Generate OOB Switch CLI Configuration
      template:
        src: "../roles/oob-switch/templates/oob_nvue_cli.j2"
        dest: "{{ config_output_dir }}/{{ hostname }}-config.sh"
        mode: '0755'
      when: "'oob' in group_names"

    - name: Collapse excessive blank lines in generated configs
      replace:
        path: "{{ config_output_dir }}/{{ hostname }}-config.sh"
        regexp: '\n{3,}'
        replace: '\n\n'

    - name: Display success message
      debug:
        msg: "✅ CLI configuration generated: {{ config_output_dir }}/{{ hostname }}-config.sh"
