telemetry:
  enabled: true
  histogram:
    counter:
      bin_min_boundary: 3552
      histogram_size: 55008
      sample_interval: 1024
    egress_buffer:
      bin_min_boundary: 960
      histogram_size: 9830400
      sample_interval: 1024
    ingress_buffer:
      bin_min_boundary: 960
      histogram_size: 2457600
      sample_interval: 1024
  snapshot_file:
    count: 120
    name: /var/run/cumulus/histogram_stats
  snapshot_interval: 10
default_vrf_bgp:
  address_family:
    ipv4_unicast:
      enable: true
      redistribute_connected: true
    l2vpn_evpn:
      enable: true
  neighbors:
  - interfaces: isl
    peer_group: internal-isl
    type: unnumbered
  - interfaces: oob_uplink
    peer_group: underlay
    type: unnumbered
  - interfaces:
    - 172.16.176.21
    - 172.16.176.22
    - 172.16.176.23
    peer_group: overlay
    type: numbered
  peer_groups:
  - id: internal-isl
    remote_as: internal
    bfd_enable: true
    description: internal_isl_interconnect
    address_family:
      ipv4_unicast:
        enable: true
      l2vpn_evpn:
        enable: true
  - id: underlay
    remote_as: external
    bfd_enable: true
    description: oob_underlay_interconnect
    address_family:
      ipv4_unicast:
        enable: true
  - id: overlay
    remote_as: external
    bfd_enable: true
    bfd_profile: overlay
    description: oob_overlay_interconnect
    multihop_ttl: 2
    update_source: lo
    address_family:
      ipv4_unicast:
        enable: false
      l2vpn_evpn:
        enable: true
nve_vxlan:
  her: evpn
  flooding_enable: true
  decap_dscp: preserve
  encap_dscp: copy
community_list:
- id: '11'
  rule:
  - id: '100'
    action: permit
    community: '11:11'
route_map:
- id: BLOCK_VTEPS
  rule:
  - id: '10'
    action: deny
    match:
    - type: ip-prefix-list
      value: VTEP_PREFIXES
    - type: type
      value: ipv4
  - id: '20'
    action: permit
    match:
    - type: ip-prefix-list
      value: ALL_PREFIXES
    - type: type
      value: ipv4
- id: EXIT_FILTER
  rule:
  - id: '10'
    action: deny
    match:
    - type: ip-prefix-list
      value: EXIT_LOCAL_IF
    - type: type
      value: ipv4
  - id: '20'
    action: permit
    set:
    - type: community
      value: '11:11'
- id: INBAND_FILTER
  rule:
  - id: '5'
    action: deny
    match:
    - type: community-list
      value: '11'
  - id: '10'
    action: deny
    match:
    - type: ip-prefix-list
      value: OOB_PREFIXES
    - type: type
      value: ipv4
  - id: '15'
    action: deny
    match:
    - type: ip-prefix-list
      value: INBAND_LOCAL_IF
    - type: type
      value: ipv4
  - id: '20'
    action: permit
    match:
    - type: ip-prefix-list
      value: ALL_PREFIXES
    - type: type
      value: ipv4
- id: OOB_FILTER
  rule:
  - id: '5'
    action: deny
    match:
    - type: community-list
      value: '11'
  - id: '10'
    action: deny
    match:
    - type: ip-prefix-list
      value: INBAND_PREFIXES
    - type: type
      value: ipv4
  - id: '15'
    action: deny
    match:
    - type: ip-prefix-list
      value: OOB_LOCAL_IF
    - type: type
      value: ipv4
  - id: '20'
    action: permit
    match:
    - type: ip-prefix-list
      value: ALL_PREFIXES
    - type: type
      value: ipv4
- id: OUTBOUND_ERA_PREFIXES
  rule:
  - id: '10'
    action: permit
    match:
    - type: ip-prefix-list
      value: ERA_PREFIXES
    - type: type
      value: ipv4
vrf_config:
- id: EXIT
  vlan: 3004
  vni: '5004'
  route_export: true
  bgp:
    address_family:
      ipv4_unicast:
        enable: true
        redistribute_connected: true
        route_export_to_evpn: true
        route_import_from_vrf:
          enable: true
          list:
          - INBAND
          - OOB
          route_map: EXIT_FILTER
      l2vpn_evpn:
        enable: true
    neighbors:
    - interfaces:
      - swp59s0
      - swp59s1
      - swp59s2
      - swp59s3
      - swp59s4
      - swp59s5
      - swp61s0
      - swp61s1
      - swp61s2
      - swp61s3
      - swp61s4
      - swp61s5
      - swp63s0
      - swp63s1
      - swp63s2
      - swp63s3
      - swp63s4
      - swp63s5
      peer_group: underlay-esl-external
      type: unnumbered
    peer_groups:
    - id: underlay-esl-external
      remote_as: external
      address_family:
        ipv4_unicast:
          enable: true
          policy:
            outbound_route_map: OUTBOUND_ERA_PREFIXES
- id: INBAND
  vlan: 3002
  vni: '5002'
  route_export: true
  route_import: true
  bgp:
    address_family:
      ipv4_unicast:
        enable: true
        redistribute_connected: true
        route_export_to_evpn: true
        route_import_from_vrf:
          enable: true
          list:
          - EXIT
          route_map: INBAND_FILTER
      l2vpn_evpn:
        enable: true
- id: GPU
  vlan: 3003
  vni: '5003'
  bgp:
    address_family:
      ipv4_unicast:
        enable: true
        redistribute_connected: true
        route_export_to_evpn: true
      l2vpn_evpn:
        enable: true
- id: OOB
  vlan: 3001
  vni: '5001'
  bgp:
    address_family:
      ipv4_unicast:
        enable: true
        redistribute_connected: true
        route_export_to_evpn: true
        route_import_from_vrf:
          enable: true
          list:
          - EXIT
          route_map: OOB_FILTER
      l2vpn_evpn:
        enable: true
