nvue_syntax:
  '5.13':
    boolean_on: 'on'
    boolean_off: 'off'
    boolean_enabled: 'on'
    boolean_disabled: 'off'
    ip_address_key: ip
    state_format: nested
  '5.14':
    boolean_on: 'on'
    boolean_off: 'off'
    boolean_enabled: enabled
    boolean_disabled: disabled
    ip_address_key: ip
    state_format: nested
  '5.15':
    boolean_on: enabled
    boolean_off: disabled
    boolean_enabled: enabled
    boolean_disabled: disabled
    ip_address_key: ipv4
    state_format: nested
ztp_server_ip: 169.254.0.2
ztp_server_host: dhcp-oob
configure_ztp_ips: true
configure_dhcp: true
dhcp_domain_name: era.local
dhcp_range_start: 192.168.1.100
dhcp_range_end: 192.168.1.200
dhcp_lease_time: 12h
dhcp_gateway: 192.168.1.1
dnsmasq_interface: ens3
cumulus_target_release: ''
cumulus_image_url: ''
ztp_enable_topology: false
ztp_enable_monitoring: false
ztp_monitoring_config: '# Add your monitoring configuration here

  '
ztp_final_reboot: true
ssh_public_key_path: ~/.ssh/id_rsa.pub
generate_configs: true
prompt_before_setup: false
