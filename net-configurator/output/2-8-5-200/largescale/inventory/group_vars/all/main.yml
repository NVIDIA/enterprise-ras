architecture: 2-8-5-200
scalable_units: 8
nodes_per_su: 4
ns_tiers: 1
ew_tiers: 1
convergence: dedicated_gpu
gpu_planes: 1
oob_uplink_mode: l3
ntp_servers:
- 0.cumulusnetworks.pool.ntp.org
- 1.cumulusnetworks.pool.ntp.org
- 2.cumulusnetworks.pool.ntp.org
- 3.cumulusnetworks.pool.ntp.org
