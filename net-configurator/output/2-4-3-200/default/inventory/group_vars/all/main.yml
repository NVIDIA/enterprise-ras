---
# ============================================================================
# Global Variables - Applied to All Switches
# ============================================================================
architecture: 2-4-3-200
scalable_units: 8
nodes_per_su: 4
ns_tiers: 1
ew_tiers: 1
convergence: full
gpu_planes: 1
oob_uplink_mode: l3
ntp_servers:
- 0.cumulusnetworks.pool.ntp.org
- 1.cumulusnetworks.pool.ntp.org
- 2.cumulusnetworks.pool.ntp.org
- 3.cumulusnetworks.pool.ntp.org
common:
  oob_network: 172.16.177.0/24
  oob_gateway: 172.16.177.1
  oob_vlan: 200
  oob_vrf: OOB
  cpu_network: 172.16.178.0/24
  cpu_gateway: 172.16.178.1
  cpu_vlan: 300
  cpu_vrf: INBAND
  support_network: 172.16.179.0/24
  support_gateway: 172.16.179.1
  support_vlan: 400
  support_vrf: INBAND
  storage_network: 172.16.180.0/24
  storage_gateway: 172.16.180.1
  storage_vlan: 500
  storage_vrf: INBAND
  gpu_network: 192.168.110.0/24
  gpu_gateway: 192.168.110.1
  gpu_vlan: 900
  gpu_vrf: GPU
  storage_vlan_tagged: false
  pre_login_message: '##############################################################################

    #      You are accessing an Information System (IS) that is provided for authorized
    use only.

    ##############################################################################'
  post_login_message: '####################################################################

    #       You are successfully logged in to: {hostname} - site: {site} / arch: {arch}

    ####################################################################'
  site: default
  arch: 2-4-3-200
ldap:
  enabled: false
  domain: example.com
  organization: Example Org
  admin_password: '{{ ldap_admin_password }}'
  base_dn: dc=example,dc=com
  root_dn: cn=admin,ou=Users,dc=example,dc=com
  servers:
  - ip: 172.20.0.78
    priority: 1
  users:
  - firstname: John
    lastname: Doe
    username: jdoe
    password: '{{ ldap_user_default_password }}'
  - firstname: Alice
    lastname: Smith
    username: asmith
    password: '{{ ldap_user_default_password }}'
status_page_enabled: true
host_dhcp: true
