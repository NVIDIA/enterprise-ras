---
# CSL Switch Configuration (Generated from Excel + Source Inventory - 2-8-9-800)

timezone: Etc/Zulu
mh_mac: 44:38:39:FF:00:AA
anycast_mac: 44:38:39:ff:00:ff
bgp_asn: 4260394788
cumulus_target_version: 5.18.0
ntp_servers:
- 0.cumulusnetworks.pool.ntp.org
- 1.cumulusnetworks.pool.ntp.org
- 2.cumulusnetworks.pool.ntp.org
- 3.cumulusnetworks.pool.ntp.org
vlans:
- 200
- 300
- 400
vnis:
  200: 4200
  300: 4300
  400: 4400
vrf_vnis:
  OOB: 5001
  INBAND: 5002
  EXIT: 5004
  STORAGE: 5005
interfaces_disabled:
- 54
num_physical_ports: 64
network_roles:
  cpu:
    ports:
    - 1
    - 2
    - 3
    - 4
    breakout: 2
    lanes: 4
    vlan: 300,400
    lacp_bypass: true
    port_overrides: {}
    bond_overrides: {}
    vlan_untagged: 300
    speed: 400G
  support:
    ports:
    - 25
    - 26
    - 27
    - 28
    breakout: 2
    lanes: 4
    vlan: 200,300,400
    lacp_bypass: true
    port_overrides: {}
    bond_overrides: {}
    vlan_untagged: 300
    speed: 400G
isl_interfaces:
  ports:
  - 29
  - 30
  - 31
  - 32
  - 33
  breakout: 2
  lanes: 4
  port_overrides: {}
  vrf: default
  speed: 400G
edge_interfaces:
  ports:
  - 64
  breakout: 4
  lanes: 2
  port_overrides: {}
  vrf: EXIT
  speed: 200G
oob_uplink_interfaces:
  ports:
  - 53
  breakout: 8
  lanes: 1
  port_overrides:
    53:
      subports:
      - 0
      - 1
  speed: 100G
dhcp_relay:
- vrf: OOB
  server_group: oob-dhcp-servers
  servers:
  - 192.168.200.78
  upstream_interfaces:
  - vlan3001_l3
  downstream_interfaces:
  - vlan200
- vrf: EXIT
  server_group: exit-dhcp-servers
  servers:
  - 10.88.88.88
  upstream_interfaces:
  - vlan3004_l3
  downstream_interfaces:
  - vlan400
telemetry:
  enabled: true
  histogram:
    counter:
      bin_min_boundary: 3552
      histogram_size: 55008
      sample_interval: 1024
    egress_buffer:
      bin_min_boundary: 960
      histogram_size: 9830400
      sample_interval: 1024
    ingress_buffer:
      bin_min_boundary: 960
      histogram_size: 2457600
      sample_interval: 1024
  snapshot_file:
    count: 120
    name: /var/run/cumulus/histogram_stats
  snapshot_interval: 10
default_vrf_bgp:
  address_family:
    ipv4_unicast:
      enable: true
      redistribute_connected: true
    l2vpn_evpn:
      enable: true
  neighbors:
  - interfaces: isl
    peer_group: internal_isl
    type: unnumbered
  - interfaces: oob_uplink
    peer_group: underlay
    type: unnumbered
  - interfaces:
    - 172.16.176.101
    - 172.16.176.102
    peer_group: overlay
    type: numbered
  peer_groups:
  - id: internal_isl
    remote_as: internal
    bfd_enable: true
    description: internal_isl_interconnect
    address_family:
      ipv4_unicast:
        enable: true
      l2vpn_evpn:
        enable: true
  - id: underlay
    remote_as: external
    bfd_enable: true
    description: oob_underlay_interconnect
    address_family:
      ipv4_unicast:
        enable: true
        policy_outbound_route_map: WEIGHTED_ECMP
  - id: overlay
    remote_as: external
    bfd_enable: true
    bfd_profile: overlay
    description: oob_overlay_interconnect
    multihop_ttl: 2
    update_source: lo
    address_family:
      ipv4_unicast:
        enable: false
      l2vpn_evpn:
        enable: true
        policy_outbound_route_map: EVPN_OOB_OUT
nve_vxlan:
  her: evpn
  flooding_enable: true
  decap_dscp: preserve
  encap_dscp: copy
community_list:
- id: '11'
  rule:
  - id: '100'
    description: match_exit_learned_route_tag
    action: permit
    community: '11:11'
route_map:
- id: BLOCK_VTEPS
  rule:
  - id: '10'
    description: deny_vtep_loopback_prefixes
    action: deny
    match:
    - type: ip-prefix-list
      value: VTEP_PREFIXES
    - type: type
      value: ipv4
  - id: '20'
    description: permit_all_other_ipv4
    action: permit
    match:
    - type: ip-prefix-list
      value: ALL_PREFIXES
    - type: type
      value: ipv4
- id: EVPN_OOB_OUT
  rule:
  - id: '10'
    description: permit_macip_of_real_oob_hosts
    action: permit
    match:
    - type: type
      value: ipv4
    - type: evpn-route-type
      value: macip
    - type: ip-prefix-list
      value: OOB_HOSTS
  - id: '20'
    description: deny_macip_outside_oob_hosts
    action: deny
    match:
    - type: type
      value: ipv4
    - type: evpn-route-type
      value: macip
  - id: '100'
    description: permit_all_other_evpn_routes
    action: permit
- id: EXIT_FILTER
  rule:
  - id: '10'
    description: deny_exit_vrf_local_interfaces
    action: deny
    match:
    - type: ip-prefix-list
      value: EXIT_LOCAL_IF
    - type: type
      value: ipv4
  - id: '20'
    description: tag_exit_learned_routes
    action: permit
    set:
    - type: community
      value: '11:11'
- id: INBAND_FILTER
  rule:
  - id: '5'
    description: deny_exit_tagged_routes
    action: deny
    match:
    - type: community-list
      value: '11'
  - id: '10'
    description: deny_oob_vrf_prefixes
    action: deny
    match:
    - type: ip-prefix-list
      value: OOB_PREFIXES
    - type: type
      value: ipv4
  - id: '15'
    description: deny_inband_vrf_local_interfaces
    action: deny
    match:
    - type: ip-prefix-list
      value: INBAND_LOCAL_IF
    - type: type
      value: ipv4
  - id: '20'
    description: permit_all_other_ipv4
    action: permit
    match:
    - type: ip-prefix-list
      value: ALL_PREFIXES
    - type: type
      value: ipv4
- id: OOB_FILTER
  rule:
  - id: '5'
    description: deny_exit_tagged_routes
    action: deny
    match:
    - type: community-list
      value: '11'
  - id: '10'
    description: deny_inband_vrf_prefixes
    action: deny
    match:
    - type: ip-prefix-list
      value: INBAND_PREFIXES
    - type: type
      value: ipv4
  - id: '15'
    description: deny_oob_vrf_local_interfaces
    action: deny
    match:
    - type: ip-prefix-list
      value: OOB_LOCAL_IF
    - type: type
      value: ipv4
  - id: '20'
    description: permit_all_other_ipv4
    action: permit
    match:
    - type: ip-prefix-list
      value: ALL_PREFIXES
    - type: type
      value: ipv4
- id: OUTBOUND_ERA_PREFIXES
  rule:
  - id: '10'
    description: permit_era_owned_prefixes_outbound
    action: permit
    match:
    - type: ip-prefix-list
      value: ERA_PREFIXES
    - type: type
      value: ipv4
- id: WEIGHTED_ECMP
  rule:
  - id: '10'
    description: enable_w_ecmp_adjustment
    action: permit
    set:
    - type: ext-community-bw
      value: multipaths
vrf_config:
- id: EXIT
  vlan: 3004
  vni: '5004'
  route_export: true
  bgp:
    address_family:
      ipv4_unicast:
        enable: true
        redistribute_connected: true
        route_export_to_evpn: true
        route_import_from_vrf:
          enable: true
          list:
          - INBAND
          - OOB
          route_map: EXIT_FILTER
      l2vpn_evpn:
        enable: true
    neighbors:
    - interfaces:
      - swp64s0
      - swp64s1
      - swp64s2
      - swp64s3
      peer_group: exit
      type: unnumbered
    peer_groups:
    - id: exit
      remote_as: external
      address_family:
        ipv4_unicast:
          enable: true
          policy:
            outbound_route_map: OUTBOUND_ERA_PREFIXES
- id: INBAND
  vlan: 3002
  vni: '5002'
  route_export: true
  route_import: true
  bgp:
    address_family:
      ipv4_unicast:
        enable: true
        redistribute_connected: true
        route_export_to_evpn: true
        route_import_from_vrf:
          enable: true
          list:
          - EXIT
          route_map: INBAND_FILTER
      l2vpn_evpn:
        enable: true
- id: OOB
  vlan: 3001
  vni: '5001'
  bgp:
    address_family:
      ipv4_unicast:
        enable: true
        redistribute_connected: true
        route_export_to_evpn: true
        route_import_from_vrf:
          enable: true
          list:
          - EXIT
          route_map: OOB_FILTER
      l2vpn_evpn:
        enable: true
