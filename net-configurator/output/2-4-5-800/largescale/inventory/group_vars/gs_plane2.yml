# ============================================================================
# GSL Spine Plane 2 (CIN Plane 2 Spine) Group Variables - 2-4-5-800
# ============================================================================

plane: 2
asn: 4200102100

# GPU fabric: emit the RoCE-lossless traffic-pool block (merged spine template gate)
roce_traffic_pool: true

# ISL ports to CIN leaves (breakout 2x)
# swp61-62 → leaf1 + leaf2, swp57-58 → leaf3 + leaf4
isl_ports: "swp57-58,swp61-62"

# Overlay peers (all 4 CIN plane 2 leaf loopbacks)
overlay_peers:
  - 10.1.2.1
  - 10.1.2.2
  - 10.1.2.3
  - 10.1.2.4

# Underlay neighbors (all breakout sub-ports on ISL ports)
underlay_neighbors:
  - swp61s0
  - swp61s1
  - swp62s0
  - swp62s1
  - swp57s0
  - swp57s1
  - swp58s0
  - swp58s1
