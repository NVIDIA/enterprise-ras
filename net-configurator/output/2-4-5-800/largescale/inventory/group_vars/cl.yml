    evpn_vlan: 3002
    vni: 245002
  STORAGE:
    evpn_vlan: 3005
    vni: 245005
overlay_peers:
- 172.16.1.2
- 172.16.1.3
underlay_route_map: WEIGHTED_ECMP
community_list:
- id: '11'
  rule:
  - id: '100'
    description: match_exit_learned_route_tag
    action: permit
    community: '11:11'
route_map:
- id: BLOCK_VTEPS
  rule:
  - id: '10'
    description: deny_vtep_loopback_prefixes
    action: deny
    match:
    - type: ip-prefix-list
      value: VTEP_PREFIXES
    - type: type
      value: ipv4
  - id: '20'
    description: permit_all_other_ipv4
    action: permit
    match:
    - type: ip-prefix-list
      value: ALL_PREFIXES
    - type: type
      value: ipv4
- id: EVPN_OOB_OUT
  rule:
  - id: '10'
    description: permit_macip_of_real_oob_hosts
    action: permit
    match:
    - type: type
      value: ipv4
    - type: evpn-route-type
      value: macip
    - type: ip-prefix-list
      value: OOB_HOSTS
  - id: '20'
    description: deny_macip_outside_oob_hosts
    action: deny
    match:
    - type: type
      value: ipv4
    - type: evpn-route-type
      value: macip
  - id: '100'
    description: permit_all_other_evpn_routes
    action: permit
- id: EXIT_FILTER
  rule:
  - id: '10'
    description: deny_exit_vrf_local_interfaces
    action: deny
    match:
    - type: ip-prefix-list
      value: EXIT_LOCAL_IF
    - type: type
      value: ipv4
  - id: '20'
    description: tag_exit_learned_routes
    action: permit
    set:
    - type: community
      value: '11:11'
- id: INBAND_FILTER
  rule:
  - id: '5'
    description: deny_exit_tagged_routes
    action: deny
    match:
    - type: community-list
      value: '11'
  - id: '10'
    description: deny_oob_vrf_prefixes
    action: deny
    match:
    - type: ip-prefix-list
      value: OOB_PREFIXES
    - type: type
      value: ipv4
  - id: '15'
    description: deny_inband_vrf_local_interfaces
    action: deny
    match:
    - type: ip-prefix-list
      value: INBAND_LOCAL_IF
    - type: type
      value: ipv4
  - id: '20'
    description: permit_all_other_ipv4
    action: permit
    match:
    - type: ip-prefix-list
      value: ALL_PREFIXES
    - type: type
      value: ipv4
- id: OOB_FILTER
  rule:
  - id: '5'
    description: deny_exit_tagged_routes
    action: deny
    match:
    - type: community-list
      value: '11'
  - id: '10'
    description: deny_inband_vrf_prefixes
    action: deny
    match:
    - type: ip-prefix-list
      value: INBAND_PREFIXES
    - type: type
      value: ipv4
  - id: '15'
    description: deny_oob_vrf_local_interfaces
    action: deny
    match:
    - type: ip-prefix-list
      value: OOB_LOCAL_IF
    - type: type
      value: ipv4
  - id: '20'
    description: permit_all_other_ipv4
    action: permit
    match:
    - type: ip-prefix-list
      value: ALL_PREFIXES
    - type: type
      value: ipv4
- id: OUTBOUND_ERA_PREFIXES
  rule:
  - id: '10'
    description: permit_era_owned_prefixes_outbound
    action: permit
    match:
    - type: ip-prefix-list
      value: ERA_PREFIXES
    - type: type
      value: ipv4
- id: WEIGHTED_ECMP
  rule:
  - id: '10'
    description: enable_w_ecmp_adjustment
    action: permit
    set:
    - type: ext-community-bw
      value: multipaths
vrf_config:
- id: INBAND
  vlan: 3002
  vni: '5002'
  route_export: true
  bgp:
    address_family:
      ipv4_unicast:
        enable: true
        redistribute_connected: true
        route_export_to_evpn: true
      l2vpn_evpn:
        enable: true
- id: OOB
  vlan: 3001
  vni: '5001'
  route_export: true
  bgp:
    address_family:
      ipv4_unicast:
        enable: 'on'
        redistribute_connected: 'on'
        route_export_to_evpn: 'on'
        route_import_from_vrf:
          enable: 'on'
          list:
          - EXIT
          route_map: OOB_FILTER
      l2vpn_evpn:
        enable: 'on'
- id: EXIT
  vlan: 3004
  vni: '5004'
  route_export: true
  bgp:
    address_family:
      ipv4_unicast:
        enable: 'on'
        redistribute_connected: 'on'
        route_export_to_evpn: 'on'
        route_import_from_vrf:
          enable: 'on'
          list:
          - OOB
          route_map: EXIT_FILTER
      l2vpn_evpn:
        enable: 'on'
    neighbors:
    - interfaces:
      - swp60s0
      - swp60s1
      - swp60s2
      - swp61s0
      - swp61s1
      - swp61s2
      - swp61s3
      - swp62s0
      - swp62s1
      - swp62s2
      - swp62s3
      peer_group: exit
      type: unnumbered
    peer_groups:
    - id: exit
      remote_as: external
      address_family:
        ipv4_unicast:
          enable: 'on'
          policy:
            outbound_route_map: OUTBOUND_ERA_PREFIXES
default_vrf_bgp:
  address_family:
    ipv4_unicast:
      enable: true
      redistribute_connected: true
    l2vpn_evpn:
      enable: true
  neighbors:
  - interfaces: isl
    peer_group: internal_isl
    type: unnumbered
  - interfaces: oob_uplink
    peer_group: underlay
    type: unnumbered
  - interfaces:
    - 172.16.1.61
    - 172.16.1.62
    - 172.16.1.63
    - 172.16.1.64
    peer_group: overlay
    type: numbered
  peer_groups:
  - id: internal_isl
    remote_as: external
    bfd_enable: true
    description: internal_isl_interconnect
    address_family:
      ipv4_unicast:
        enable: true
        policy_outbound_route_map: WEIGHTED_ECMP
      l2vpn_evpn:
        enable: true
  - id: underlay
    remote_as: external
    bfd_enable: true
    description: oob_underlay_interconnect
    address_family:
      ipv4_unicast:
        enable: true
        policy_outbound_route_map: WEIGHTED_ECMP
  - id: overlay
    remote_as: external
    bfd_enable: true
    bfd_profile: overlay
    description: oob_overlay_interconnect
    multihop_ttl: 2
    update_source: lo
    address_family:
      ipv4_unicast:
        enable: false
      l2vpn_evpn:
        enable: true
        policy_outbound_route_map: EVPN_OOB_OUT
