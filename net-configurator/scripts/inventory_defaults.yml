# Single home for invariant group_vars/host_vars content.
#   all_shared : arch-independent infra defaults (ztp_server_host derived by loader).
#   devices    : per-arch server node inventory (candidate to derive from Excel).
#   oob, core  : per-arch group_vars.
#   host_vars  : per-arch Air virtual-node host_vars (dhcp-oob/oob-server-01/... —
#                nodes not in the Excel Nodes sheet). NOTE known drift to normalize:
#                2-4-5-800 carries none; only 2-8-5-200's oob-server-01 has the OOB
#                gateway oob_server_interfaces.
# Loaded by scripts/inventory_defaults.py; guarded by tests/test_seedless_generation.py.
