core:
  2-4-3-200:
    timezone: Etc/Zulu
    telemetry:
      enabled: true
      histogram:
        counter:
          bin_min_boundary: 3552
          histogram_size: 55008
          sample_interval: 1024
        egress_buffer:
          bin_min_boundary: 960
          histogram_size: 9830400
          sample_interval: 1024
        ingress_buffer:
          bin_min_boundary: 960
          histogram_size: 2457600
          sample_interval: 1024
      snapshot_file:
        count: 120
        name: /var/run/cumulus/histogram_stats
      snapshot_interval: 10
    default_vrf_bgp:
      address_family:
        ipv4_unicast:
          enable: true
          redistribute_connected: true
        l2vpn_evpn:
          enable: true
      neighbors:
      - interfaces: isl
        peer_group: underlay
        type: unnumbered
        ttl_security_hops: 1
      peer_groups:
      - id: underlay
        remote_as: internal
        bfd_enable: true
        description: underlay_switch_interconnect
        address_family:
          l2vpn_evpn:
            enable: true
      - id: exit
        remote_as: external
        bfd_enable: true
        description: exit_interconnect
        address_family:
          ipv4_unicast:
            enable: true
            policy_outbound_route_map: OUTBOUND_ERA_PREFIXES
    nve_vxlan:
      her: evpn
      flooding_enable: true
      decap_dscp: preserve
      encap_dscp: copy
    community_list:
    - id: '11'
      rule:
      - id: '100'
        description: match_exit_learned_route_tag
        action: permit
        community: '11:11'
    route_map:
    - id: BLOCK_VTEPS
      rule:
      - id: '10'
        description: deny_vtep_loopback_prefixes
        action: deny
        match:
        - type: ip-prefix-list
          value: VTEP_PREFIXES
        - type: type
          value: ipv4
      - id: '20'
        description: permit_all_other_ipv4
        action: permit
        match:
        - type: ip-prefix-list
          value: ALL_PREFIXES
        - type: type
          value: ipv4
    - id: EVPN_OOB_OUT
      rule:
      - id: '10'
        description: permit_macip_of_real_oob_hosts
        action: permit
        match:
        - type: type
          value: ipv4
        - type: evpn-route-type
          value: macip
        - type: ip-prefix-list
          value: OOB_HOSTS
      - id: '20'
        description: deny_macip_outside_oob_hosts
        action: deny
        match:
        - type: type
          value: ipv4
        - type: evpn-route-type
          value: macip
      - id: '100'
        description: permit_all_other_evpn_routes
        action: permit
    - id: EXIT_FILTER
      rule:
      - id: '10'
        description: deny_exit_vrf_local_interfaces
        action: deny
        match:
        - type: ip-prefix-list
          value: EXIT_LOCAL_IF
        - type: type
          value: ipv4
      - id: '20'
        description: tag_exit_learned_routes
        action: permit
        set:
        - type: community
          value: '11:11'
    - id: INBAND_FILTER
      rule:
      - id: '5'
        description: deny_exit_tagged_routes
        action: deny
        match:
        - type: community-list
          value: '11'
      - id: '10'
        description: deny_oob_vrf_prefixes
        action: deny
        match:
        - type: ip-prefix-list
          value: OOB_PREFIXES
        - type: type
          value: ipv4
      - id: '15'
        description: deny_inband_vrf_local_interfaces
        action: deny
        match:
        - type: ip-prefix-list
          value: INBAND_LOCAL_IF
        - type: type
